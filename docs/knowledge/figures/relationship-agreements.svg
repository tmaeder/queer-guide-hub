<svg role="img" aria-label="Partners can discuss time, boundaries, expectations and changes without assuming a relationship label answers those questions." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" class="h-auto w-full text-foreground" focusable="false"><path d="M48 54 L48 318 C48 378,12 378,12 318 L12 54 C12 18,48 18,48 54" fill="none" stroke="currentColor" stroke-width="2"></path><circle cx="48" cy="54" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="51" fill="currentColor" font-size="20" font-weight="700">Ask</text><text x="72" y="79" fill="currentColor" font-size="17">What kind of connection do we want?</text><circle cx="48" cy="142" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="139" fill="currentColor" font-size="20" font-weight="700">Discuss</text><text x="72" y="167" fill="currentColor" font-size="17">What expectations and boundaries matter?</text><circle cx="48" cy="230" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="227" fill="currentColor" font-size="20" font-weight="700">Agree</text><text x="72" y="255" fill="currentColor" font-size="17">What have we each freely agreed to?</text><circle cx="48" cy="318" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="315" fill="currentColor" font-size="20" font-weight="700">Revisit</text><text x="72" y="343" fill="currentColor" font-size="17">What has changed, and what needs to change?</text></svg>
