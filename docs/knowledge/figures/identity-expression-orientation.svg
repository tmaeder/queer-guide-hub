<svg role="img" aria-label="Gender identity, gender expression and orientation answer different questions; none predicts the others." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" class="h-auto w-full text-foreground" focusable="false"><path d="M48 54 L48 230" fill="none" stroke="currentColor" stroke-width="2"></path><circle cx="48" cy="54" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="51" fill="currentColor" font-size="20" font-weight="700">Identity</text><text x="72" y="79" fill="currentColor" font-size="17">How do I understand my gender?</text><line x1="72" x2="616" y1="96" y2="96" stroke="currentColor" opacity="0.2"></line><circle cx="48" cy="142" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="139" fill="currentColor" font-size="20" font-weight="700">Expression</text><text x="72" y="167" fill="currentColor" font-size="17">How do I present or express myself?</text><line x1="72" x2="616" y1="184" y2="184" stroke="currentColor" opacity="0.2"></line><circle cx="48" cy="230" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="227" fill="currentColor" font-size="20" font-weight="700">Orientation</text><text x="72" y="255" fill="currentColor" font-size="17">How do I describe attraction?</text><line x1="72" x2="616" y1="272" y2="272" stroke="currentColor" opacity="0.2"></line></svg>
