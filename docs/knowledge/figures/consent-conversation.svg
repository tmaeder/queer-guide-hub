<svg role="img" aria-label="Ask without pressure, listen for freely given agreement, check in and stop when agreement is absent or withdrawn." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" class="h-auto w-full text-foreground" focusable="false"><path d="M48 54 L48 318 C48 378,12 378,12 318 L12 54 C12 18,48 18,48 54" fill="none" stroke="currentColor" stroke-width="2"></path><circle cx="48" cy="54" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="51" fill="currentColor" font-size="20" font-weight="700">Ask</text><text x="72" y="79" fill="currentColor" font-size="17">Leave room for any answer</text><circle cx="48" cy="142" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="139" fill="currentColor" font-size="20" font-weight="700">Listen</text><text x="72" y="167" fill="currentColor" font-size="17">Uncertainty means pause</text><circle cx="48" cy="230" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="227" fill="currentColor" font-size="20" font-weight="700">Check in</text><text x="72" y="255" fill="currentColor" font-size="17">Agreement can change</text><circle cx="48" cy="318" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="315" fill="currentColor" font-size="20" font-weight="700">Stop</text><text x="72" y="343" fill="currentColor" font-size="17">Respect a no or withdrawal immediately</text></svg>
