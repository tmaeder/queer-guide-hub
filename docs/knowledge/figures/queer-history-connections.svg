<svg role="img" aria-label="A selective timeline connects organising in Berlin, community care in New York and the rainbow flag in San Francisco." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" class="h-auto w-full text-foreground" focusable="false"><path d="M48 54 L48 230" fill="none" stroke="currentColor" stroke-width="2"></path><circle cx="48" cy="54" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="51" fill="currentColor" font-size="20" font-weight="700">1897 · Berlin</text><text x="72" y="79" fill="currentColor" font-size="17">Scientific-Humanitarian Committee founded</text><circle cx="48" cy="142" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="139" fill="currentColor" font-size="20" font-weight="700">1970 · New York</text><text x="72" y="167" fill="currentColor" font-size="17">Johnson and Rivera establish STAR</text><circle cx="48" cy="230" r="7" fill="hsl(var(--background, 0 0% 100%))" stroke="currentColor" stroke-width="3"></circle><text x="72" y="227" fill="currentColor" font-size="20" font-weight="700">1978 · San Francisco</text><text x="72" y="255" fill="currentColor" font-size="17">Rainbow flag first flown</text></svg>
