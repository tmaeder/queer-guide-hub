    <!-- Blank-page guard for stale HTML after a deploy. MUST stay a classic
         inline script and MUST stay ahead of the module entry Vite injects.

         A cached index.html (browser, service worker, or CDN) can reference a
         hashed chunk that a later deploy deleted. Cloudflare Pages ships no
         404.html, so its built-in fallback answers the dead URL with
         index.html — 200 text/html. The browser refuses that as a module, the
         whole entry graph fails, and #root stays empty: a blank page rather
         than a broken-looking one.

         src/main.tsx already has a `vite:preloadError` recovery for this, but
         it cannot fire here: main.tsx is itself inside the failed graph, so
         its listener is never registered. Reproduced against a Pages-mimicking
         server — the page rendered blank with navCount 1 and the
         sessionStorage gate never armed. That handler covers *dynamic*
         imports after boot; only an out-of-graph listener covers the entry
         graph itself.

         The failure surfaces as an `error` event on the entry <script>
         element — verified; the dead chunk's own modulepreload link fires
         nothing — so match any same-origin /assets/ script rather than trying
         to identify the dead URL. -->
    <script>
      (function () {
        // Shared sentinel with the copy functions/_middleware.ts injects into
        // every HTML response (see functions/_lib/boot-guard.ts). That
        // injection is the only thing that can reach a document older than
        // this guard; when both are present, whichever runs first wins and the
        // other bails, so the two can never double-reload.
        if (window.__qgBootGuard) return;
        window.__qgBootGuard = 1;
        var KEY = 'preload-error-reload'; // shared with main.tsx, which clears it on a good load
        function alreadyRetried() {
          try {
            // Storage works (the normal case): precise one-retry-per-session gate,
            // matching main.tsx so the two mechanisms can't double-reload.
            return !!sessionStorage.getItem(KEY);
          } catch (e) { /* storage blocked — fall through */ }
          try {
            // No storage: a reload-type navigation means we already retried.
            var nav = performance.getEntriesByType('navigation')[0];
            return !!(nav && nav.type === 'reload');
          } catch (e2) {
            return true; // can't tell — refuse to reload rather than risk a loop
          }
        }
        // A plain location.reload() CANNOT fix this. The stale document is held
        // at the edge, not in the browser cache — /city/berlin was observed
        // serving `age: 72721` under `s-maxage=300` — so reloading re-requests
        // the same cache key and gets the same dead chunk hashes back. The
        // one-retry gate then blocks any further attempt, which is precisely
        // how a page ends up permanently blank instead of self-healing.
        // Reloading through a throwaway query param selects a different cache
        // key and reaches origin; main.tsx strips it once the app boots.
        function reloadFresh() {
          try {
            var u = new URL(location.href);
            u.searchParams.set('__fresh', String(Date.now()));
            location.replace(u.toString());
          } catch (e3) {
            location.reload(); // URL unavailable — better than nothing
          }
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || el === window || el.tagName !== 'SCRIPT') return;
          // Only our own hashed build output; ignore third-party script errors.
          if (String(el.src || '').lastIndexOf(location.origin + '/assets/', 0) !== 0) return;
          if (alreadyRetried()) return; // genuinely broken, not stale — don't loop
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (err) { /* private mode */ }
          reloadFresh();
        }, true); // capture — resource load errors do not bubble
      })();
    </script>

    <!-- Sync theme before paint. Reads the same localStorage key the
         ThemeProvider uses and applies the .light/.dark class to <html>
         immediately, so the first paint matches the user's saved choice.
         Without this the page rendered as light first, then flipped to
         dark when React hydrated. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ui-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'dark' || saved === 'light'
            ? saved
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
        } catch (e) { /* private mode or no localStorage — fall back to light */ }
      })();
    </script>
