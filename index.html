    <!-- Blank-page guard for a broken module graph after a deploy. MUST stay
         a classic inline script and MUST stay ahead of the module entry Vite
         injects. The BODY of this script must stay byte-identical (modulo
         whitespace) to BOOT_GUARD_JS in functions/_lib/boot-guard.ts — the
         copy the middleware injects into documents older than this one; a
         unit test (bootGuardSync.test.ts) enforces the match. The shared
         window.__qgBootGuard sentinel keeps the two copies from ever both
         running.

         Two failure shapes, one symptom (#root stays empty):

         1. STALE DOCUMENT — a cached index.html references a hashed chunk a
            later deploy deleted. Pages ships no 404.html, so its fallback
            answers the dead URL with index.html (200 text/html); the browser
            refuses it as a module. Recovery: reload the document through a
            throwaway ?__fresh= query — a different cache key reaches origin.

         2. POISONED BROWSER CACHE — the document is CURRENT, but a chunk
            fetched during the deploy window was answered with that fallback
            HTML or a 404, and public/_headers stamps /assets/* immutable, so
            the browser cached the failure for a year. A document reload
            CANNOT fix this one (measured on a real user's Chrome 2026-08-08:
            8 chunks pinned at 404, the guard fired on every reload, page
            stayed blank forever). Recovery: rewrite each cache entry with
            fetch(url, {cache:'reload'}) BEFORE the document reload.

         Both recoveries below; the heal is a no-op when the cache is clean.

         src/main.tsx has a `vite:preloadError` recovery too, but it cannot
         fire here: main.tsx is itself inside the failed graph, so its
         listener is never registered. The failure surfaces as an `error`
         event on the entry <script> element — verified; the dead chunk's own
         modulepreload link fires nothing — so match any same-origin /assets/
         script (or stylesheet) rather than trying to identify the dead URL. -->
    <script>
      (function () {
        /* Versioned sentinel: guards from before 2026-08-09 set 1 and lack
           the cache heal, and on an edge-stale document the OLD inline copy
           runs before the middleware-injected copy. Run past a v1 sentinel
           so a heal-capable guard always arms; never run twice ourselves. */
        if (Number(window.__qgBootGuard) >= 2) return;
        window.__qgBootGuard = 2;
        var KEY = 'preload-error-reload';
        var ASSETS = location.origin + '/assets/';
        var MAX_ATTEMPTS = 2;
        var fired = false;
        function attemptsSoFar() {
          try {
            var n = Number(sessionStorage.getItem(KEY)) || 0;
            /* legacy format stored Date.now() - read it as one attempt used */
            return n > 1000 ? 1 : n;
          } catch (e) {
            return -1; /* storage blocked */
          }
        }
        function alreadyRetried() {
          var n = attemptsSoFar();
          if (n >= 0) return n >= MAX_ATTEMPTS;
          try {
            /* No storage: bound by the URL itself - a document already
               carrying __fresh IS the retry. (location.replace records
               nav.type 'navigate', never 'reload', so the navigation-type
               check alone cannot gate this path.) */
            if (String(location.search).indexOf('__fresh=') !== -1) return true;
            var nav = performance.getEntriesByType('navigation')[0];
            return !!(nav && nav.type === 'reload');
          } catch (e2) {
            return true; /* cannot tell - refuse to reload rather than risk a loop */
          }
        }
        function bumpAttempts() {
          var n = attemptsSoFar();
          if (n < 0) return; /* private mode */
          try { sessionStorage.setItem(KEY, String(n + 1)); } catch (e3) { /* ignore */ }
        }
        function reloadFresh() {
          try {
            var u = new URL(location.href);
            u.searchParams.set('__fresh', String(Date.now()));
            location.replace(u.toString());
          } catch (e4) {
            location.reload(); /* URL unavailable - better than nothing */
          }
        }
        function healAssets(done) {
          var urls = [];
          var seen = {};
          function add(u) {
            u = String(u || '');
            if (u.lastIndexOf(ASSETS, 0) !== 0 || seen[u]) return;
            seen[u] = 1;
            urls.push(u);
          }
          try {
            var els = document.querySelectorAll('script[src], link[rel="modulepreload"], link[rel="stylesheet"]');
            for (var i = 0; i < els.length; i++) add(els[i].src || els[i].href);
            var res = performance.getEntriesByType('resource');
            for (var j = 0; j < res.length; j++) add(res[j].name);
          } catch (e5) { /* heal whatever was collected */ }
          if (!urls.length || typeof fetch !== 'function') { done(); return; }
          var finished = false;
          var pending = urls.length;
          function step() {
            if (finished) return;
            pending -= 1;
            if (pending <= 0) { finished = true; done(); }
          }
          /* Hard cap so a dead network cannot strand the recovery reload. */
          setTimeout(function () { if (!finished) { finished = true; done(); } }, 4000);
          for (var k = 0; k < urls.length; k++) {
            try { fetch(urls[k], { cache: 'reload' }).then(step, step); } catch (e6) { step(); }
          }
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          /* One recovery per document: a deploy window can poison the entry
             script AND the stylesheet, firing two error events - without
             the latch one broken document burns the whole retry budget
             before its first reload. */
          if (fired || !el || el === window || !el.tagName) return;
          var isScript = el.tagName === 'SCRIPT';
          var isStylesheet = el.tagName === 'LINK' && el.rel === 'stylesheet';
          if (!isScript && !isStylesheet) return;
          /* Only our own hashed build output; ignore third-party failures. */
          if (String(el.src || el.href || '').lastIndexOf(ASSETS, 0) !== 0) return;
          if (alreadyRetried()) return;
          fired = true;
          bumpAttempts();
          healAssets(reloadFresh);
        }, true); /* capture - resource load errors do not bubble */
      })();
    </script>

    <!-- Dark mode removed 2026-08 (subway-map rebrand: fixed paper/ink
         identity). Strip any persisted dark class before paint so a
         returning dark-mode user gets the light poster immediately. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          localStorage.removeItem('ui-theme');
        } catch (e) { /* private mode — fine */ }
      })();
    </script>

    <!-- Default OG/Twitter tags. The Pages middleware (functions/_middleware.ts)
         appends per-route og:url, og:title, og:description, twitter:title and
         twitter:description so the *last* tag wins per crawler precedence. -->
    <meta property="og:title" content="Queer Guide — LGBTQ+ Safe Spaces, Events & Community" />
    <meta property="og:description" content="The global guide to LGBTQ+ venues, events, travel and community. Find safe spaces near you and around the world." />
    <meta property="og:type" content="website" />

    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;border:1px solid #000;border-radius:8px">
        <h1 style="margin:0 0 .5rem;font-size:1.25rem">Crisis support</h1>
        <p style="margin:0 0 .75rem">In acute danger, call your local emergency number now:</p>
        <ul style="margin:0;padding-left:1.25rem;line-height:1.7">
          <li><strong>Europe:</strong> <a href="tel:112">112</a></li>
          <li><strong>US / Canada:</strong> <a href="tel:911">911</a></li>
          <li><strong>UK:</strong> <a href="tel:999">999</a></li>
          <li><strong>Australia:</strong> <a href="tel:000">000</a></li>
          <li><strong>US Suicide &amp; Crisis Lifeline:</strong> <a href="tel:988">988</a></li>
        </ul>
        <p style="margin-top:1rem">Please enable JavaScript to see the full directory of LGBTQIA+ crisis hotlines.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
