name: Redirect QR service
on:
  pull_request:
    paths:
      - 'workers/redirect-qr/**'
      - 'supabase/functions/_shared/redirect-qr-style.ts'
      - 'src/lib/redirects/qrRender.ts'
      - 'src/integrations/supabase/client.ts'
      - 'functions/api/qr*'
      - 'scripts/redirect-qr-deployment-config.mjs'
      - 'scripts/test-redirect-qr-worker.mjs'
      - '.github/workflows/redirect-qr.yml'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'workers/redirect-qr/**'
      - 'supabase/functions/_shared/redirect-qr-style.ts'
      - 'src/lib/redirects/qrRender.ts'
      - 'src/integrations/supabase/client.ts'
      - 'functions/api/qr*'
      - 'scripts/redirect-qr-deployment-config.mjs'
      - '.github/workflows/redirect-qr.yml'
      - 'package*.json'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: redirect-qr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22', cache: npm }
      - run: npm ci --prefer-offline --no-audit
      - run: npx tsc -p workers/redirect-qr/tsconfig.json --noEmit
      - run: npx vitest run src/lib/redirects/__tests__/qrHosted.test.ts functions/api/qr.test.ts
      - run: npm run test:redirect-qr
      - run: node scripts/redirect-qr-deployment-config.mjs
      - name: Deploy the private image Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.0'
          command: deploy --config workers/redirect-qr/tmp/deploy.wrangler.json
