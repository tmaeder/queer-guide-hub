name: Migration Drift Recovery

# Recovers migrations that are APPLIED to prod but have no repo file, and opens
# a PR with them.
#
# WHY THIS IS AUTOMATED
#
# MCP `apply_migration` stamps a version and commits nothing, so the follow-up
# commit is a separate step that is easy to skip. Skipping it is not a private
# mistake: `migration-versions` fails on any applied version with no repo file
# and runs on EVERY pr, so one uncommitted migration reds a TypeScript-only
# change that never touched SQL, while `db push` on main refuses to run at all.
# On 2026-08-29 that happened five times in one day, each halting the repo's CI
# until a human noticed a red check and hand-recovered it.
#
# WHY IT OPENS A PR AND NEVER PUSHES TO MAIN
#
# Recovering SQL out of prod and into permanent history is a content change, and
# a migration that arrived via MCP skipped review once already — committing it
# unreviewed would skip it twice. The PR is also where a human sees what the
# migration actually did, since `statements` does not record the original
# comment header and that reasoning is gone.
#
# The detector (`check-migration-drift.mjs`, every 6h) stays as it is. This is
# the remediation half; detection continuing to fail loudly is the backstop for
# anything recovery skips.

on:
  schedule:
    # Offset from the 6-hourly drift monitor so a recovery PR exists before the
    # next detection run reports the same drift again.
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  # Never two recovery PRs for the same drift. A second run would rebuild the
  # identical files and open a duplicate.
  group: migration-drift-recovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the recovery prefers the author's own file when the
          # migration exists on some branch (real comments, real reasoning) over
          # a reconstruction from parsed statements. A shallow clone would hide
          # every such branch and silently downgrade to the lossy path.
          fetch-depth: 0
          # Push as the PAT's identity when one exists, so the branch push and
          # the PR are attributed to a real user. See the token note below.
          token: ${{ secrets.DRIFT_RECOVERY_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recover drifted migrations
        id: recover
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          # The script exits 2 with no token, 1 when something was found, 0 when
          # clean. Capture the code rather than letting a pipe swallow it.
          rc=0
          node scripts/recover-migration-drift.mjs --write 2>&1 | tee /tmp/recover.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" = "2" ]; then
            echo "::error::Could not read remote migration history — SUPABASE_ACCESS_TOKEN missing or the API is unreachable."
            echo "::error::This is NOT a clean result. Failing rather than reporting no drift."
            exit 2
          fi

          # `git status --porcelain`, NOT `git diff` — a recovered migration is
          # a NEW file, and `git diff` does not see untracked ones. This gate
          # read clean on every run since the workflow shipped, so the script
          # kept reconstructing the SQL correctly and the workflow kept throwing
          # it away: run 33869205348 logged "✓ Wrote 2 file(s)." immediately
          # followed by "No drift to recover." That is why the write path was
          # still marked unproven in CLAUDE.md while `migration-versions` failed
          # on every open PR in the repo.
          if [ -z "$(git status --porcelain -- supabase/migrations)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift to recover."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # WHY THIS NEEDS A PAT, and what happens without one.
      #
      # GitHub does not start workflow runs for events caused by the built-in
      # GITHUB_TOKEN — a recursion guard, not a misconfiguration. So a PR this
      # job opens with GITHUB_TOKEN arrives with NONE of the required contexts
      # reporting, and a required check that never reports reads as pending
      # forever: auto-merge can never fire and the PR sits there.
      #
      # Measured 2026-09-13 on #3677, the first PR this workflow ever managed to
      # open: 12 required contexts, 0 reporting. Enabling "Allow GitHub Actions
      # to create and approve pull requests" (which was the previous blocker)
      # fixed opening the PR and exposed this immediately underneath it.
      #
      # DRIFT_RECOVERY_PAT should be a fine-grained PAT on this repo with
      # Contents: read/write and Pull requests: read/write. With it, the push
      # and the PR are attributed to a real identity and CI runs normally.
      #
      # The fallback is deliberately LOUD, not silent. Without the PAT this job
      # still recovers the files and opens the PR — losing that would be worse —
      # but it emits a ::warning:: saying the PR's CI will not run and telling
      # the next human the exact unblock (`gh pr close N && gh pr reopen N`
      # under a user token, then re-arm auto-merge, which closing clears).
      # A drift recovery that looks finished but cannot merge is the failure
      # this whole workflow exists to prevent, one layer up.
      - name: Open recovery PR
        if: steps.recover.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DRIFT_RECOVERY_PAT || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.DRIFT_RECOVERY_PAT != '' }}
        run: |
          set -euo pipefail
          # Same reason as the gate above: these files are untracked, so
          # `git diff --name-only` counts zero and the PR body would claim it
          # recovered nothing while carrying the files.
          n=$(git status --porcelain -- supabase/migrations | wc -l | tr -d ' ')
          branch="auto/migration-drift-recovery-$(date -u +%Y%m%d%H%M%S)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add supabase/migrations

          # Prose lives in files rather than inline heredocs: an unindented
          # heredoc inside a `run: |` block terminates the YAML block scalar,
          # which is a parse error the workflow only reveals when it runs.
          {
            echo "fix(migrations): recover $n migration(s) applied to prod with no repo file"
            echo
            cat .github/migration-drift-recovery/commit-body.txt
          } > /tmp/commit-msg.txt

          git commit -F /tmp/commit-msg.txt
          git push -u origin "$branch"

          url=$(gh pr create \
            --title "fix(migrations): recover $n migration(s) applied to prod with no repo file" \
            --body-file .github/migration-drift-recovery/pr-body.md)
          echo "Opened $url"

          if [ "${HAVE_PAT}" != "true" ]; then
            echo "::warning::Opened with GITHUB_TOKEN, so this PR's CI will NOT run and it can never auto-merge (required checks stay pending forever). Unblock: 'gh pr close <n> && gh pr reopen <n>' under a user token, then re-arm auto-merge (closing clears it). Durable fix: add a DRIFT_RECOVERY_PAT repo secret (fine-grained, Contents + Pull requests read/write)."
          fi

      - name: Report versions that could not be recovered
        if: always() && steps.recover.outputs.rc == '1'
        run: |
          echo "::warning::Some versions could not be recovered automatically — see the log."
          grep -E "SKIPPED|could NOT be recovered" /tmp/recover.log || true
