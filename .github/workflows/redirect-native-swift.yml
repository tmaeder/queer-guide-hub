name: Redirect native Swift contracts
on:
  pull_request:
    paths:
      - 'sdk/redirects/swift/**'
      - 'scripts/test-redirect-swift.mjs'
      - 'scripts/lib/redirect-native-test-wire.mjs'
      - 'supabase/functions/_shared/redirect-native-resolution.ts'
      - 'supabase/functions/redirect-handler/**'
      - 'functions/go/**'
      - 'workers/redirect-domains/**'
      - '.github/workflows/redirect-native-swift.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/redirects/swift/**'
      - 'scripts/test-redirect-swift.mjs'
      - 'scripts/lib/redirect-native-test-wire.mjs'
      - 'supabase/functions/_shared/redirect-native-resolution.ts'
      - 'supabase/functions/redirect-handler/**'
      - 'functions/go/**'
      - 'workers/redirect-domains/**'
      - '.github/workflows/redirect-native-swift.yml'
permissions:
  contents: read
concurrency:
  group: redirect-swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
      - name: Compile Swift package and run native URLSession contracts
        run: node scripts/test-redirect-swift.mjs
      - name: Initialize native CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      # Keep traced compilation in a direct step with the job's build budget
      # and persistent output, separate from the contract runner's process cap.
      - name: Build SDK for Swift CodeQL
        run: swift build --package-path sdk/redirects/swift --scratch-path tmp/native-swift-codeql -Xswiftc -warnings-as-errors
      - name: Analyze native client
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift/native-redirects
