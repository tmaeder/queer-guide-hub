name: E2E i18n Smoke

# This suite tests PRODUCTION (E2E_BASE_URL defaults to https://queer.guide).
#
# It therefore must NOT run on `push: main`: that fires the same instant as
# `Deploy to Cloudflare Pages`, so the tests hit prod WHILE the deploy is in
# flight and fail with "page rendered empty — likely crashed" on routes that are
# briefly 404ing. Measured 2026-08-05: the smoke suite finished at 19:11:11 while
# the deploy ran until 19:22:23 — eleven minutes of testing a half-deployed site,
# reported as a failure of the commit that had just merged.
#
# `workflow_run` after the deploy completes is the correct trigger, and is what
# seo-check.yml already does.
on:
  workflow_run:
    workflows: [Deploy to Cloudflare Pages]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'e2e/trips-i18n.spec.ts'
      - 'src/i18n/**'
      - 'src/pages/trips/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-i18n.yml'
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://queer.guide'

permissions:
  contents: read

concurrency:
  group: e2e-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-smoke:
    name: Trip planner i18n smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failed deploy leaves prod on the previous build, so testing it would
    # report on a commit that never shipped. Mirrors seo-check.yml.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      BASE_URL_INPUT: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        uses: ./.github/actions/setup-playwright

      - name: Run i18n smoke tests
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://queer.guide' }}
        run: npx playwright test e2e/trips-i18n.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
