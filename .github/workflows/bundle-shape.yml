name: bundle-shape
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-bundle-shape.mjs'
permissions:
  contents: read
# Superseded checks do not need to finish on an older commit.
concurrency:
  group: bundle-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
