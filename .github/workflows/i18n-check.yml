name: i18n Translation Completeness

on:
  # Runs on every PR so the "Verify locales have all en.json keys"
  # required status check is always reported. Path filtering used to
  # skip the workflow entirely for non-i18n PRs, which left them
  # permanently BLOCKED on the missing required check.
  pull_request:
  # Merge queue: a required check that never reports on the merge_group event
  # leaves the queued PR pending forever. Same failure this repo already hit
  # twice with `paths:` filters on required checks.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'public/locales/**'
      - 'scripts/sync-translations.ts'
      - 'scripts/sync-public-locales.ts'

concurrency:
  group: i18n-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-keys:
    name: Verify locales have all en.json keys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare locales against en.json + verify src/public parity
        run: npm run i18n:check
