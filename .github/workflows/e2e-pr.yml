# BACKEND (2026-10-23): the specs run against a LOCAL Supabase loaded from the
# nightly production snapshot (db-snapshot.yml + scripts/ci/db-snapshot.sh),
# not against production. Until then each run sent ~18 min of browser traffic
# to the live database: CI e2e was 53% of production API reads, contributed to
# the egress-quota restriction of 2026-10-20/21, and ~20 suites/hour crashed it
# twice (2026-10-16, 2026-10-17). The PR's NEW migrations are applied on top of
# the snapshot, so a migration is tested against the real schema before it
# ships. Search still uses the production worker (search.queer.guide).
# PRs that receive no secrets (forks, Dependabot) cannot decrypt the snapshot
# and fall back to the production backend, with a warning.
name: E2E Critical Path (PR)

# Fast subset of the Playwright suite that runs on every PR.
# Full suite still runs nightly (see e2e-nightly.yml).

# NOTE: deliberately NOT path-filtered at the trigger level.
# "Critical paths" is a REQUIRED status check on main. A required check skipped
# by a `paths:` filter never reports at all, and GitHub treats never-reported as
# permanently pending — so any PR outside the filter (a functions/**-only or
# supabase/**-only change) became unmergeable forever, with no bypass because
# the rule is admin-enforced. PRs #2593 and #2595 sat green-but-BLOCKED on
# exactly this.
# The filter now lives INSIDE the job: it always reports, and short-circuits the
# expensive work when nothing relevant changed.
on:
  pull_request:
    branches: [main]
  # Merge queue: a required check that never reports on the merge_group event
  # leaves the queued PR pending forever. Same failure this repo already hit
  # twice with `paths:` filters on required checks.
  merge_group:

concurrency:
  group: e2e-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  critical:
    name: Critical paths
    runs-on: ubuntu-latest
    # Raised from 12 when the admin session became real. Until the E2E_ADMIN_*
    # secrets existed, auth.setup.ts skipped and all 34 admin-route-baseline
    # tests skipped with it — the 12-minute budget was measured against a run
    # that was NOT doing that work. The first run with a live session took
    # 10.8m of tests and was killed at 12m during teardown, which GitHub
    # reports as `cancelled`, not `timed out` — so it read as a concurrency
    # cancellation rather than the budget it actually was.
    #
    # 20 STAYS, and the next person to see a `cancelled` here should not raise
    # it. Measured 2026-08-19 across five green runs: whole job 8m08s-8m56s
    # (npm ci ~15-20s, playwright install 22-102s, build ~8s, specs 6m34s-7m12s).
    # That is 2.3x headroom. Every `cancelled` run that day died inside
    # `playwright install --with-deps`, stalled on a dead Ubuntu mirror for
    # 12-20 minutes — see .github/actions/setup-playwright, which bounds it.
    # A bigger budget buys a longer stall, not a green check.
    #
    # Also note: not every `cancelled` here is this budget. `concurrency` +
    # `cancel-in-progress` kills the previous run the moment a new commit
    # lands, and GitHub reports THAT as `cancelled` too. Check the job's
    # elapsed time before diagnosing — ~20m is the cap, anything shorter is a
    # supersession (runs 32268586231 and 32236106405 were superseded, not
    # timed out).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect relevant changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "scope=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          # `supabase/migrations/` is in the list because the specs below run a
          # LOCAL build of this PR against the LIVE backend, so a schema change
          # can break them while nothing in src/ moved. PR #4423 is the worked
          # example: get_admin_review_queue was costing 8,664ms against the 8s
          # statement_timeout on `authenticated`, /admin answered 500 for every
          # staff user, and admin-inbox-renders.spec.ts — which is ON the list
          # below and exists to catch exactly that — never ran, because a
          # migration-only diff matched nothing here and the job short-circuited
          # to success in 8 seconds.
          #
          # Scoped to migrations, NOT all of `supabase/`: edge functions deploy
          # separately and are covered by edge-fn-tests, so pulling in
          # `supabase/functions/` would add ~7 minutes to a large share of PRs
          # for paths these browser specs do not exercise.
          #
          # The cost is deliberate and worth stating: this makes every migration
          # PR depend on production backend health. That is the same coupling
          # that reds unrelated PRs when prod is slow, now applied to a busy
          # path. If it starts crying wolf, narrow the SPEC LIST for this
          # trigger rather than silently dropping the path — a filter that
          # excludes schema changes is how this class went unnoticed.
          #
          # NARROWED 2026-10-20: a migration-only diff runs the two admin specs
          # that catch the #4423 class (an RPC too slow for the 8s timeout
          # turns /admin into a 500), not all ~250 tests. Measured on prod:
          # each full suite is ~18 min of browser traffic against the LIVE
          # backend, and once ~20+ full suites/hour ran concurrently the
          # database stalled and was crash-restarted twice (2026-10-16 20:03 at
          # 33/hr, 2026-10-17 07:18 at 31/hr; Azure browser traffic was 71% of
          # REST time in that window). A src/-touching PR still runs everything.
          if echo "$files" | grep -qE '^(src/|public/|e2e/|index\.html$|vite\.config\.ts$|playwright(\.taxonomy)?\.config\.ts$|tsconfig\.taxonomy-e2e\.json$|package\.json$|package-lock\.json$|\.github/workflows/e2e-pr\.yml$|\.github/actions/setup-playwright/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::Relevant paths changed - running critical-path specs."
          elif echo "$files" | grep -qE '^(supabase/migrations/|scripts/ci/|\.github/workflows/db-snapshot\.yml$)'; then
            # The narrowing above protected PRODUCTION from load. The specs now
            # run on the local snapshot DB, so a migration gets the full suite.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration/snapshot diff - running critical-path specs on the local DB."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app/e2e paths changed - skipping specs, reporting success."
          fi
          if echo "$files" | grep -qE '^(scripts/ci/db-snapshot\.sh|scripts/ci/snapshot-fixtures\.mjs|scripts/ci/supabase-retry\.sh|\.github/workflows/db-snapshot\.yml)$'; then
            echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot cache key
        if: steps.changes.outputs.relevant == 'true'
        id: key
        # Same versioned key db-snapshot.yml saves under: it changes when the
        # exporter, fixtures or snapshot workflow change (snapshot-fixtures.mjs).
        run: echo "cache_key=$(node scripts/ci/snapshot-fixtures.mjs cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore DB snapshot
        if: steps.changes.outputs.relevant == 'true'
        id: snap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: db-snapshot.tgz.enc
          key: ${{ steps.key.outputs.cache_key }}
          # Fall back to the newest v2 snapshot from main (an older day or digest)
          # rather than reading production on every run.
          restore-keys: |
            ${{ steps.key.outputs.cache_key }}-
            db-snapshot-v2-
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        if: steps.changes.outputs.relevant == 'true'
        with:
          version: 2.98.2
      - name: Prepare the database
        if: steps.changes.outputs.relevant == 'true'
        id: db
        env:
          KEY: ${{ secrets.DB_SNAPSHOT_KEY }}
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HIT: ${{ steps.snap.outputs.cache-matched-key }}
          REBUILD: ${{ steps.changes.outputs.snapshot_changed }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::No DB_SNAPSHOT_KEY (fork or Dependabot PR): running against the PRODUCTION backend."
            echo "mode=prod" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$REBUILD" = "true" ]; then
            # This PR changes how the snapshot is built: test that, not last night's.
            scripts/ci/db-snapshot.sh dump "$PROD_DB_URL" snapshot
          elif [ -n "$HIT" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in db-snapshot.tgz.enc | tar -xzf -
          else
            echo "::error::No DB snapshot in the cache. Run the 'DB snapshot' workflow on main."; exit 1
          fi
          echo "snapshot: ${HIT:-rebuilt in this run}" >> "$GITHUB_STEP_SUMMARY"

          mkdir -p /tmp/migrations && mv supabase/migrations/*.sql /tmp/migrations/
          # PostgREST stays unhealthy until the snapshot creates pgmq_public (config.toml
          # exposes it); it retries the schema cache on its own, so do not wait for it.
          scripts/ci/supabase-retry.sh start --ignore-health-check -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
          eval "$(supabase status -o env)"
          scripts/ci/db-snapshot.sh load "$DB_URL" snapshot

          # Private automation state is deliberately absent from the anonymous
          # snapshot. Supply local, no-network dependencies only while this
          # guarded migration is pending; never resurrect the retired producer.
          if [ -f /tmp/migrations/99991792816500_event_owned_artwork_producer.sql ] && ! grep -qx '99991792816500' snapshot/versions.txt; then
            DB_URL="$DB_URL" node scripts/ci/seed-event-artwork-migration.mjs > /tmp/ci-artwork-dependencies.sql
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /tmp/ci-artwork-dependencies.sql
          fi

          # Backend ACLs are absent from the anonymous export. Recreate only
          # this pending guard's local preconditions; never touch production.
          if [ -f /tmp/migrations/20261025175909_complete_security_advisor_backend_contracts.sql ] && ! grep -qx '20261025175909' snapshot/versions.txt; then
            DB_URL="$DB_URL" node scripts/ci/seed-backend-policy-migration.mjs > /tmp/ci-backend-policy-dependencies.sql
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /tmp/ci-backend-policy-dependencies.sql
          fi

          # Only the PR's NEW migrations: versions production has not applied.
          for f in $(ls /tmp/migrations/*.sql | sort); do
            v=$(basename "$f" | cut -d_ -f1)
            grep -qx "$v" snapshot/versions.txt && continue
            echo "applying $(basename "$f")"
            psql "$DB_URL" -X -q -1 -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DB_URL" -X -q -c "notify pgrst, 'reload schema'"
          for i in $(seq 30); do curl -sf "$API_URL/rest/v1/" -H "apikey: $ANON_KEY" -o /dev/null && break; sleep 2; done

          # A local admin, plus synthetic admin rows the anon-only snapshot lacks.
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"
          email=ci-admin@example.test
          uid=$(curl -sf "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$pw\",\"email_confirm\":true}" | jq -r .id)
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "insert into public.user_roles (user_id, role) values ('$uid', 'admin')"
          # Synthetic review/archived fixtures (loopback DB only), then prove the
          # real admin and public RPCs answer before Playwright starts.
          DB_URL="$DB_URL" node scripts/ci/snapshot-fixtures.mjs seed-admin > /tmp/ci-review-fixtures.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /tmp/ci-review-fixtures.sql
          DB_URL="$DB_URL" API_URL="$API_URL" ANON_KEY="$ANON_KEY" \
            E2E_ADMIN_EMAIL="$email" E2E_ADMIN_PASSWORD="$pw" \
            node scripts/ci/snapshot-fixtures.mjs verify

          # Sanity: an anon read must see the glossary (it once silently copied 0 tags).
          n=$(curl -s "$API_URL/rest/v1/unified_tags?select=id&limit=1" -H "apikey: $ANON_KEY" | jq length)
          [ "$n" = 1 ] || { echo "::error::anon sees no unified_tags in the local DB"; exit 1; }

          { echo "VITE_SUPABASE_URL=$API_URL"; echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY";
            echo "E2E_ADMIN_EMAIL=$email"; echo "E2E_ADMIN_PASSWORD=$pw";
            echo "E2E_TAXONOMY_DB_URL=$DB_URL"; } >> "$GITHUB_ENV"
          echo "mode=local" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-playwright
        if: steps.changes.outputs.relevant == 'true'
      - name: Build app
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Run all 53 taxonomy mutation regressions on the isolated backend
        if: steps.db.outputs.mode == 'local'
        env:
          E2E_BASE_URL: http://127.0.0.1:4174
        run: |
          npm run test:e2e:taxonomies:contracts
          npx tsc -p tsconfig.taxonomy-e2e.json
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          taxonomy_preview_pid=$!
          trap 'kill "$taxonomy_preview_pid"' EXIT
          for i in $(seq 30); do
            curl -fsS "$E2E_BASE_URL/" -o /dev/null && break
            sleep 1
          done
          npm run test:e2e:taxonomies
      - name: Upload taxonomy persistence and cleanup evidence
        if: always() && steps.db.outputs.mode == 'local'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: taxonomy-e2e-report
          path: |
            playwright-report/taxonomies/
            test-results/taxonomies.json
            test-results/taxonomies/
          retention-days: 7
      - name: Run critical-path specs
        if: steps.changes.outputs.relevant == 'true'
        env:
          E2E_BASE_URL: http://localhost:4173
          PROD_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          MODE: ${{ steps.db.outputs.mode }}
        run: |
          if [ "$MODE" = prod ]; then
            export E2E_ADMIN_EMAIL="$PROD_ADMIN_EMAIL" E2E_ADMIN_PASSWORD="$PROD_ADMIN_PASSWORD"
          fi
          npx vite preview --port 4173 &
          sleep 5
          npx playwright test \
            e2e/auth.setup.ts \
            e2e/auth-signup-renders.spec.ts \
            e2e/search.spec.ts \
            e2e/trip-creation.spec.ts \
            e2e/marketplace.spec.ts \
            e2e/admin-pipelines.spec.ts \
            e2e/admin-route-baseline.spec.ts \
            e2e/admin-inbox-renders.spec.ts \
            e2e/admin-archived-lifecycle.spec.ts \
            e2e/about-colophon-gate.spec.ts \
            e2e/removed-ui-elements.spec.ts \
            e2e/venues/detail-content.spec.ts \
            e2e/help-locale.spec.ts \
            e2e/locale-prefix.spec.ts \
            e2e/breadcrumb-reachability.spec.ts \
            e2e/hotels-filters.spec.ts \
            e2e/nested-interactive.spec.ts \
            e2e/intent-nav.spec.ts \
            e2e/glossary-integration.spec.ts \
            e2e/tags-substance-interactions.spec.ts \
            e2e/tags-sti-guide.spec.ts \
            e2e/competitions.spec.ts \
            e2e/singles.spec.ts \
            e2e/legal-pages.spec.ts \
            e2e/analytics-consent.spec.ts \
            e2e/map-shell.spec.ts \
            e2e/trans-rights.spec.ts \
            --reporter=line
          # e2e/auth.setup.ts is FIRST on the list and is load-bearing.
          # Passing explicit file paths filters EVERY project, including the
          # `setup` project whose testMatch is /auth\.setup\.ts$/ — so without
          # naming it here the setup has zero tests, never writes
          # playwright/.auth/admin.json, and every admin route in the run
          # redirects to /auth. Measured: all 34 admin-route-baseline tests
          # skipped for "no admin session" while the storageState in
          # playwright.config.ts pointed at a file that was never created.
          # admin-route-baseline.spec.ts is on the list for the same reason as
          # singles.spec.ts below: it exists to catch regressions introduced by
          # the archetype migration, and a migration lands in a PR. Left to the
          # nightly it would report the breakage the morning after the change
          # that caused it, against a merged commit.
          # singles.spec.ts is in the list above rather than left to the nightly
          # run for the reason it exists: /villages/:slug shipped for months on
          # a dead layout branch with no safety gating because NOTHING
          # exercised it. A spec written to close that gap, parked behind a
          # hardcoded list it is not on, closes nothing.
          # tags-sti-guide.spec.ts sits here, not just in the nightly, because
          # the page it guards is the sexual-health reference linked from the
          # main nav and it has already shipped four measured defects: six
          # duplicated practice bands, risk marks with `border-width: 0` against
          # an explicit contract, a 3.66x horizontal drag at phone width, and
          # HIV's "12w+" clipped into background-coloured text. Nightly-only
          # means a fifth one ships and serves readers for up to 24h. Note this
          # job sets E2E_BASE_URL to the local preview, so the spec tests THIS
          # build; its own default baseURL (prod) applies only when run by hand
          # or by the nightly.
          # tags-substance-interactions.spec.ts is on this list for the reason
          # stated for singles.spec.ts above. `substance_interactions` is written
          # by migrations and, since `source_tripsit`, by a weekly cron — and a
          # migration lands in a PR. The nightly `npm run test:e2e` discovers it
          # either way, but reporting a wiped interaction chart the morning after
          # the change that wiped it is not a gate. It guards the multi-source
          # invariant: /tags/methamphetamine's 10 combinations are ALL eve&rave,
          # so if a TripSit refresh ever takes those rows over, the page empties.
          # map-shell.spec.ts ran in NO workflow at all until 2026-08-19 —
          # neither this list nor the nightly — so it had never gated anything
          # in its life. It asserts the lens controls by accessible NAME, and
          # #2880 renamed all four labels (Pins/Density/Boundary ->
          # Stations/Heat/Areas) without touching it; three tests went red on
          # prod and the rename still shipped green. Worse, the repair session
          # then read one of those failures as an app bug and parked a
          # `test.fixme` on a lens-sharing assertion that was in fact correct.
          # A spec nothing runs does not just miss regressions, it manufactures
          # phantom ones. ~1.1m for 8 tests, against a job measured at 8-9m of
          # a 20m budget.
          # trans-rights.spec.ts is on this list rather than left to the nightly
          # because what it guards is a SAFETY INVARIANT, not a layout: TGEU's
          # documented-violence counts rank countries close to inversely to legal
          # risk, so a change that colours them with --destructive, drops the
          # reporting caveat, or leaks a count into the trip-safety briefing
          # turns the page into a danger ranking that is roughly the opposite of
          # the truth. That regression must fail in the PR that writes it, not
          # the morning after it merges.
          # tags-not-found.spec.ts must NEVER be added to this list, and it was
          # tried on 2026-08-20. It asserts `res.status() === 404` for an unknown
          # /tags/:slug, which is `functions/_middleware.ts` answering — and this
          # job serves `vite preview` on localhost:4173, a static server with no
          # Pages Functions at all. The SPA fallback returns 200 there, so both
          # of its tests fail by construction, on every run, no matter the app.
          # It already runs in the nightly, whose baseURL defaults to
          # https://queer.guide, which is the only surface that HAS an edge.
          # The PR-time guard for the SPA half of that route is the unit test in
          # src/pages/__tests__/TagDetail.test.tsx — an edge-backed 404 hides the
          # SPA branch entirely, so prod e2e cannot cover the meta it emits.
          # legal-pages.spec.ts is here for the SAME reason as design-system
          # below, and it is the second time this exact fault has been paid for.
          # The elevation contract is asserted in two files; only one of them was
          # on this list. So when #2848 inverted it (--shadow-hard -> the soft
          # re-skin), that PR ran the copy it had correctly migrated and never
          # ran the copy it broke — `legal-pages.spec.ts` went stale invisibly and
          # took the nightly down from 2026-08-18. A design-contract assertion
          # parked behind a hardcoded list it is not on guards nothing, and the
          # nightly is the only e2e `main` gets (this workflow is
          # `pull_request`-only), so the report arrives a day late against an
          # already-merged commit.
          # Design-system guards (radius tiers + monochrome) used to run ONLY in
          # the nightly suite, so the PHOTOCOPY radius retune passed every PR
          # check and turned nightly red the next morning. Second invocation
          # because --grep is global and would filter the specs above; shares
          # the preview server already running in this step. The visual snapshot
          # block stays nightly-only — it needs CI-generated baselines and would
          # otherwise block PRs on any intentional visual change.
          npx playwright test \
            e2e/design-system.spec.ts \
            e2e/rounded-surface-contract.spec.ts \
            --grep-invert "visual snapshots" \
            --reporter=line
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Non-blocking: storing a diagnostic report must not fail a job whose
        # assertions already passed. See the long note in a11y.yml — GitHub's
        # artifact service returned a persistent 403 on FinalizeArtifact on
        # 2026-09-08 and turned green test runs into red required checks.
        # Deliverable artifacts (dist, dist-static, extension zips, generated
        # baselines) are deliberately NOT given this treatment.
        continue-on-error: true
        with:
          name: playwright-pr-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
