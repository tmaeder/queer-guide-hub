name: E2E Critical Path (PR)

# Fast subset of the Playwright suite that runs on every PR.
# Full suite still runs nightly (see e2e-nightly.yml).

# NOTE: deliberately NOT path-filtered at the trigger level.
# "Critical paths" is a REQUIRED status check on main. A required check skipped
# by a `paths:` filter never reports at all, and GitHub treats never-reported as
# permanently pending — so any PR outside the filter (a functions/**-only or
# supabase/**-only change) became unmergeable forever, with no bypass because
# the rule is admin-enforced. PRs #2593 and #2595 sat green-but-BLOCKED on
# exactly this.
# The filter now lives INSIDE the job: it always reports, and short-circuits the
# expensive work when nothing relevant changed.
on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  critical:
    name: Critical paths
    runs-on: ubuntu-latest
    # Raised from 12 when the admin session became real. Until the E2E_ADMIN_*
    # secrets existed, auth.setup.ts skipped and all 34 admin-route-baseline
    # tests skipped with it — the 12-minute budget was measured against a run
    # that was NOT doing that work. The first run with a live session took
    # 10.8m of tests and was killed at 12m during teardown, which GitHub
    # reports as `cancelled`, not `timed out` — so it read as a concurrency
    # cancellation rather than the budget it actually was.
    #
    # 20 STAYS, and the next person to see a `cancelled` here should not raise
    # it. Measured 2026-08-19 across five green runs: whole job 8m08s-8m56s
    # (npm ci ~15-20s, playwright install 22-102s, build ~8s, specs 6m34s-7m12s).
    # That is 2.3x headroom. Every `cancelled` run that day died inside
    # `playwright install --with-deps`, stalled on a dead Ubuntu mirror for
    # 12-20 minutes — see .github/actions/setup-playwright, which bounds it.
    # A bigger budget buys a longer stall, not a green check.
    #
    # Also note: not every `cancelled` here is this budget. `concurrency` +
    # `cancel-in-progress` kills the previous run the moment a new commit
    # lands, and GitHub reports THAT as `cancelled` too. Check the job's
    # elapsed time before diagnosing — ~20m is the cap, anything shorter is a
    # supersession (runs 32268586231 and 32236106405 were superseded, not
    # timed out).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^(src/|public/|e2e/|index\.html$|vite\.config\.ts$|playwright\.config\.ts$|package\.json$|package-lock\.json$|\.github/workflows/e2e-pr\.yml$|\.github/actions/setup-playwright/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Relevant paths changed - running critical-path specs."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app/e2e paths changed - skipping specs, reporting success."
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-playwright
        if: steps.changes.outputs.relevant == 'true'
      - name: Build app
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Run critical-path specs
        if: steps.changes.outputs.relevant == 'true'
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          npx vite preview --port 4173 &
          sleep 5
          npx playwright test \
            e2e/auth.setup.ts \
            e2e/auth-signup-renders.spec.ts \
            e2e/search.spec.ts \
            e2e/trip-creation.spec.ts \
            e2e/marketplace.spec.ts \
            e2e/admin-pipelines.spec.ts \
            e2e/admin-route-baseline.spec.ts \
            e2e/venues/detail-content.spec.ts \
            e2e/help-locale.spec.ts \
            e2e/locale-prefix.spec.ts \
            e2e/hotels-filters.spec.ts \
            e2e/nested-interactive.spec.ts \
            e2e/intent-nav.spec.ts \
            e2e/glossary-integration.spec.ts \
            e2e/singles.spec.ts \
            e2e/legal-pages.spec.ts \
            e2e/map-shell.spec.ts \
            e2e/trans-rights.spec.ts \
            e2e/scroll-restoration.spec.ts \
            --reporter=line
          # e2e/auth.setup.ts is FIRST on the list and is load-bearing.
          # Passing explicit file paths filters EVERY project, including the
          # `setup` project whose testMatch is /auth\.setup\.ts$/ — so without
          # naming it here the setup has zero tests, never writes
          # playwright/.auth/admin.json, and every admin route in the run
          # redirects to /auth. Measured: all 34 admin-route-baseline tests
          # skipped for "no admin session" while the storageState in
          # playwright.config.ts pointed at a file that was never created.
          # admin-route-baseline.spec.ts is on the list for the same reason as
          # singles.spec.ts below: it exists to catch regressions introduced by
          # the archetype migration, and a migration lands in a PR. Left to the
          # nightly it would report the breakage the morning after the change
          # that caused it, against a merged commit.
          # singles.spec.ts is in the list above rather than left to the nightly
          # run for the reason it exists: /villages/:slug shipped for months on
          # a dead layout branch with no safety gating because NOTHING
          # exercised it. A spec written to close that gap, parked behind a
          # hardcoded list it is not on, closes nothing.
          # map-shell.spec.ts ran in NO workflow at all until 2026-08-19 —
          # neither this list nor the nightly — so it had never gated anything
          # in its life. It asserts the lens controls by accessible NAME, and
          # #2880 renamed all four labels (Pins/Density/Boundary ->
          # Stations/Heat/Areas) without touching it; three tests went red on
          # prod and the rename still shipped green. Worse, the repair session
          # then read one of those failures as an app bug and parked a
          # `test.fixme` on a lens-sharing assertion that was in fact correct.
          # A spec nothing runs does not just miss regressions, it manufactures
          # phantom ones. ~1.1m for 8 tests, against a job measured at 8-9m of
          # a 20m budget.
          # trans-rights.spec.ts is on this list rather than left to the nightly
          # because what it guards is a SAFETY INVARIANT, not a layout: TGEU's
          # documented-violence counts rank countries close to inversely to legal
          # risk, so a change that colours them with --destructive, drops the
          # reporting caveat, or leaks a count into the trip-safety briefing
          # turns the page into a danger ranking that is roughly the opposite of
          # the truth. That regression must fail in the PR that writes it, not
          # the morning after it merges.
          # scroll-restoration.spec.ts is on this list for the reason singles
          # and map-shell are: what it guards is invisible to every other
          # check. Nothing owned the scroll offset across navigation for the
          # life of the app, so following a link from a scrolled listing opened
          # the destination at its BOTTOM, and lint, typecheck, axe and every
          # unit test were green throughout — jsdom has no layout, so nothing
          # there can clamp an offset. ALL THREE of its cases fail with the fix
          # reverted, measured against a production build rather than the dev
          # server. Left to the nightly, that regression would be reported
          # against a merged commit. ~13s for 3 tests.
          # A fourth case was written and removed: it asserted that a filter
          # change on /venues issued no window.scrollTo, which passed locally
          # and failed in CI on all three attempts by catching an object-form
          # call this code never makes — so on a populated /venues something
          # else already scrolls on a filter change. That invariant is covered
          # exactly by the ScrollManager unit test instead; a gate assertion
          # that is false about the app is worse than none.
          # tags-not-found.spec.ts must NEVER be added to this list, and it was
          # tried on 2026-08-20. It asserts `res.status() === 404` for an unknown
          # /tags/:slug, which is `functions/_middleware.ts` answering — and this
          # job serves `vite preview` on localhost:4173, a static server with no
          # Pages Functions at all. The SPA fallback returns 200 there, so both
          # of its tests fail by construction, on every run, no matter the app.
          # It already runs in the nightly, whose baseURL defaults to
          # https://queer.guide, which is the only surface that HAS an edge.
          # The PR-time guard for the SPA half of that route is the unit test in
          # src/pages/__tests__/TagDetail.test.tsx — an edge-backed 404 hides the
          # SPA branch entirely, so prod e2e cannot cover the meta it emits.
          # legal-pages.spec.ts is here for the SAME reason as design-system
          # below, and it is the second time this exact fault has been paid for.
          # The elevation contract is asserted in two files; only one of them was
          # on this list. So when #2848 inverted it (--shadow-hard -> the soft
          # re-skin), that PR ran the copy it had correctly migrated and never
          # ran the copy it broke — `legal-pages.spec.ts` went stale invisibly and
          # took the nightly down from 2026-08-18. A design-contract assertion
          # parked behind a hardcoded list it is not on guards nothing, and the
          # nightly is the only e2e `main` gets (this workflow is
          # `pull_request`-only), so the report arrives a day late against an
          # already-merged commit.
          # Design-system guards (radius tiers + monochrome) used to run ONLY in
          # the nightly suite, so the PHOTOCOPY radius retune passed every PR
          # check and turned nightly red the next morning. Second invocation
          # because --grep is global and would filter the specs above; shares
          # the preview server already running in this step. The visual snapshot
          # block stays nightly-only — it needs CI-generated baselines and would
          # otherwise block PRs on any intentional visual change.
          npx playwright test \
            e2e/design-system.spec.ts \
            --grep-invert "visual snapshots" \
            --reporter=line
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pr-report
          path: playwright-report/
          retention-days: 7
