# Critical paths against a LOCAL Supabase built from a production snapshot
# (db-snapshot.yml), instead of against production.
#
# Not a required check yet. It runs beside "Critical paths" (e2e-pr.yml) until
# its pass rate matches; then the required check moves here and e2e-pr.yml
# stops sending browser traffic to production.
#
# Why a snapshot and not migration replay: replaying supabase/migrations/ on an
# empty database fails on 957 of 2,450 files (measured 2026-10-22, PR #4556).
# The baseline is a reconstruction, and many files ran against a production
# state that no longer exists. Only the PR's NEW migrations are replayed here.
#
# Search still goes to search.queer.guide (the production worker).
name: E2E Critical Path (local DB)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/e2e-local.yml'
      - '.github/workflows/db-snapshot.yml'
      - 'scripts/ci/db-snapshot.sh'
      - 'scripts/ci/e2e-seed.sql'

concurrency:
  group: e2e-local-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Rebuilds the snapshot in this run so the job below cannot race a separate
  # snapshot workflow (two workflows on one branch cancelled each other).
  snapshot:
    uses: ./.github/workflows/db-snapshot.yml
    secrets: inherit

  critical-local:
    name: Critical paths (local DB)
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore snapshot
        id: snap
        uses: actions/cache/restore@v4
        with:
          path: db-snapshot.tgz.enc
          key: db-snapshot-none
          restore-keys: db-snapshot-
      - name: Stop if no snapshot or no key
        env:
          KEY: ${{ secrets.DB_SNAPSHOT_KEY }}
          HIT: ${{ steps.snap.outputs.cache-matched-key }}
        run: |
          if [ -z "$HIT" ] || [ -z "$KEY" ]; then
            echo "::error::No DB snapshot (run db-snapshot.yml) or no DB_SNAPSHOT_KEY (fork PR)."; exit 1
          fi
          echo "snapshot: $HIT" >> "$GITHUB_STEP_SUMMARY"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in db-snapshot.tgz.enc | tar -xzf -

      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - name: Start local Supabase and load the snapshot
        run: |
          mkdir -p /tmp/migrations && mv supabase/migrations/*.sql /tmp/migrations/
          # PostgREST stays unhealthy until the snapshot creates pgmq_public (config.toml
          # exposes it); it retries the schema cache on its own, so do not wait for it here.
          scripts/ci/supabase-retry.sh start --ignore-health-check -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
          eval "$(supabase status -o env)"
          { echo "DB_URL=$DB_URL"; echo "API_URL=$API_URL"; echo "ANON_KEY=$ANON_KEY"; } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"; echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          scripts/ci/db-snapshot.sh load "$DB_URL" snapshot
          psql "$DB_URL" -X -c "notify pgrst, 'reload schema'"
          for i in $(seq 30); do curl -sf "$API_URL/rest/v1/" -H "apikey: $ANON_KEY" -o /dev/null && break; sleep 2; done
          curl -sf "$API_URL/rest/v1/countries?select=slug&limit=1" -H "apikey: $ANON_KEY"; echo

      - name: Apply this PR's new migrations
        run: |
          fail=0
          for f in $(ls /tmp/migrations/*.sql | sort); do
            v=$(basename "$f" | cut -d_ -f1)
            grep -qx "$v" snapshot/versions.txt && continue
            echo "applying $(basename "$f")"
            psql "$DB_URL" -X -q -1 -v ON_ERROR_STOP=1 -f "$f" || fail=1
          done
          exit $fail

      - name: Seed the admin user
        run: |
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"
          email=ci-admin@example.test
          uid=$(curl -sf "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$pw\",\"email_confirm\":true}" | jq -r .id)
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "insert into public.user_roles (user_id, role) values ('$uid', 'admin')"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/ci/e2e-seed.sql || echo "::warning::e2e seed failed; admin specs will show why"
          { echo "E2E_ADMIN_EMAIL=$email"; echo "E2E_ADMIN_PASSWORD=$pw"; } >> "$GITHUB_ENV"

      - name: Snapshot sanity
        run: |
          psql "$DB_URL" -X -c "select count(*) tags, count(*) filter (where status = 'active') active from public.unified_tags"
          psql "$DB_URL" -X -c "select slug, status, publication_role, is_sensitive from public.unified_tags where slug in ('lesbian','transgender','methamphetamine','sti-guide')"
          psql "$DB_URL" -X -c "select count(*) from public.substance_interactions"
          curl -s "$API_URL/rest/v1/unified_tags?slug=eq.lesbian&select=slug,status" -H "apikey: $ANON_KEY"; echo
          curl -s -X POST "$API_URL/rest/v1/rpc/substance_interaction_matrix" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' -d '{}' | head -c 400; echo

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - name: Build app against the local API
        run: VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Run critical-path specs
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" PLAYWRIGHT_JSON_OUTPUT_NAME=results.json
          npx vite preview --port 4173 &
          sleep 5
          # Same list as e2e-pr.yml; that file says why each spec is on it.
          npx playwright test \
            e2e/auth.setup.ts e2e/auth-signup-renders.spec.ts e2e/search.spec.ts \
            e2e/trip-creation.spec.ts e2e/marketplace.spec.ts e2e/admin-pipelines.spec.ts \
            e2e/admin-route-baseline.spec.ts e2e/admin-inbox-renders.spec.ts \
            e2e/admin-archived-lifecycle.spec.ts e2e/about-colophon-gate.spec.ts \
            e2e/removed-ui-elements.spec.ts e2e/venues/detail-content.spec.ts \
            e2e/help-locale.spec.ts e2e/locale-prefix.spec.ts e2e/breadcrumb-reachability.spec.ts \
            e2e/hotels-filters.spec.ts e2e/nested-interactive.spec.ts e2e/intent-nav.spec.ts \
            e2e/glossary-integration.spec.ts e2e/tags-substance-interactions.spec.ts \
            e2e/tags-sti-guide.spec.ts e2e/competitions.spec.ts e2e/singles.spec.ts \
            e2e/legal-pages.spec.ts e2e/analytics-consent.spec.ts e2e/map-shell.spec.ts \
            e2e/trans-rights.spec.ts e2e/design-system.spec.ts e2e/rounded-surface-contract.spec.ts \
            --grep-invert "visual snapshots" --reporter=line,json || status=$?
          node -e "const r=require('./results.json').stats;console.log(r)" | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: e2e-local-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
