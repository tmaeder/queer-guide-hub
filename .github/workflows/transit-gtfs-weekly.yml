name: Transit timetable (Swiss + German GTFS → city_transit_service)

# "Last departure tonight" per city, derived from the national Swiss GTFS feed.
# Design: docs/plans/2026-10-22-zurich-late-night-mobility-design.md (Step 1).
#
# WEEKLY because opentransportdata.swiss republishes the feed weekly and its terms
# require derived data to refresh at the source's frequency. Runs here, not in an
# edge function: the zip is ~290 MB and unpacks to 4.5 GB (stop_times alone 3.7 GB).
#
# Outside admin_automations, so run tracking cannot see it — the sentinel in
# scripts/check-pipeline-health.mjs (transit section) is what notices a dead job.

on:
  schedule:
    - cron: '23 4 * * 2' # Tuesdays; the feed is published Wednesdays, so this reads a settled file
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transit-gtfs-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      # The dataset is per timetable year (timetable-<YYYY>-gtfs2020) and each feed ends at
      # the mid-December timetable change. Pinning one year would blank the reader on
      # 13 December (it refuses expired feeds), so December reads next year's dataset,
      # falling back to the current one if it is not published yet.
      - name: Download Swiss GTFS
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          years="$y"; [ "$m" = "12" ] && years="$((y + 1)) $y"
          for yr in $years; do
            url="https://data.opentransportdata.swiss/en/dataset/timetable-${yr}-gtfs2020/permalink"
            if curl -sSfL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" "$url"; then echo "using $url"; break; fi
          done
          unzip -l "$RUNNER_TEMP/gtfs.zip" | tail -1

      - name: Derive and commit (Switzerland)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --max-old-space-size=2048 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/gtfs.zip" --feed ch --commit

      # Germany: gtfs.de nationwide feed (DELFI e.V., CC BY 4.0). Its calendar spans only
      # ~4 weeks ahead, so this weekly refresh is what keeps it from expiring. Runs even if
      # the Swiss step failed: the two feeds are independent rows.
      - name: Download German GTFS
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/gtfs.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gtfs-de.zip" "https://download.gtfs.de/germany/free/latest.zip"
          unzip -l "$RUNNER_TEMP/gtfs-de.zip" | tail -1

      - name: Derive and commit (Germany)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --max-old-space-size=2048 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/gtfs-de.zip" --feed de --commit
