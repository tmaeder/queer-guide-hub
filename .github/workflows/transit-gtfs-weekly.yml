name: Transit timetable (CH + DE + Vienna + French GTFS → city_transit_service)

# "Last departure tonight" per city, derived from the national Swiss GTFS feed.
# Design: docs/plans/2026-10-22-zurich-late-night-mobility-design.md (Step 1).
#
# WEEKLY because opentransportdata.swiss republishes the feed weekly and its terms
# require derived data to refresh at the source's frequency. Runs here, not in an
# edge function: the zip is ~290 MB and unpacks to 4.5 GB (stop_times alone 3.7 GB).
#
# Outside admin_automations, so run tracking cannot see it — the sentinel in
# scripts/check-pipeline-health.mjs (transit section) is what notices a dead job.

on:
  schedule:
    - cron: '23 4 * * 2' # Tuesdays; the feed is published Wednesdays, so this reads a settled file
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transit-gtfs-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      # The dataset is per timetable year (timetable-<YYYY>-gtfs2020) and each feed ends at
      # the mid-December timetable change. Pinning one year would blank the reader on
      # 13 December (it refuses expired feeds), so December reads next year's dataset,
      # falling back to the current one if it is not published yet.
      - name: Download Swiss GTFS
        run: |
          y=$(date -u +%Y); m=$(date -u +%m)
          years="$y"; [ "$m" = "12" ] && years="$((y + 1)) $y"
          for yr in $years; do
            url="https://data.opentransportdata.swiss/en/dataset/timetable-${yr}-gtfs2020/permalink"
            if curl -sSfL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" "$url"; then echo "using $url"; break; fi
          done
          unzip -l "$RUNNER_TEMP/gtfs.zip" | tail -1

      - name: Derive and commit (Switzerland)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --max-old-space-size=2048 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/gtfs.zip" --feed ch --commit

      # Germany: gtfs.de nationwide feed (DELFI e.V., CC BY 4.0). Its calendar spans only
      # ~4 weeks ahead, so this weekly refresh is what keeps it from expiring. Runs even if
      # the Swiss step failed: the two feeds are independent rows.
      - name: Download German GTFS
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/gtfs.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gtfs-de.zip" "https://download.gtfs.de/germany/free/latest.zip"
          unzip -l "$RUNNER_TEMP/gtfs-de.zip" | tail -1

      - name: Derive and commit (Germany)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --max-old-space-size=2048 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/gtfs-de.zip" --feed de --commit

      # Vienna: Wiener Linien open data (CC BY 4.0, no key, refreshed every 6h). The
      # national Mobilitätsverbünde feeds (Graz, Linz, Salzburg, Innsbruck) need an account.
      - name: Download Vienna GTFS
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/gtfs-de.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gtfs-at.zip" "https://www.wienerlinien.at/ogd_realtime/doku/ogd/gtfs/gtfs.zip"
          unzip -l "$RUNNER_TEMP/gtfs-at.zip" | tail -1

      - name: Derive and commit (Vienna)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --max-old-space-size=2048 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/gtfs-at.zip" --feed at --commit

      # France: one urban network per feed (Licence Ouverte, or ODbL for Paris/Lyon/Toulouse/
      # Montpellier/Rennes), via transport.data.gouv.fr's
      # stable data.gouv.fr resource links. A failing city is reported and the rest still
      # commit; the step fails at the end so the run is red.
      - name: Download, derive and commit (France)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rm -f "$RUNNER_TEMP/gtfs-at.zip"
          failed=""
          # Optional third column: a fallback feed, tried when the first has no full
          # week ahead (Rennes publishes "current" and "upcoming" timetables separately).
          build() {
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.zip" "$2" \
              && node --max-old-space-size=3072 scripts/transit/build-city-service.mjs "$RUNNER_TEMP/$1.zip" --feed "$1" --commit
          }
          while read -r feed url fallback; do
            echo "::group::$feed"
            if build "$feed" "$url"; then :
            elif [ -n "$fallback" ] && build "$feed" "$fallback"; then echo "$feed: used fallback feed"
            else failed="$failed $feed"; fi
            rm -f "$RUNNER_TEMP/$feed.zip"
            echo "::endgroup::"
          done <<'FEEDS'
          fr-marseille https://www.data.gouv.fr/api/1/datasets/r/7eef6ec9-9ebb-44f2-becb-2efc522522d6
          fr-lille https://www.data.gouv.fr/api/1/datasets/r/c9e5dd3f-8eed-4ad7-aec2-915240599cf6
          fr-nice https://www.data.gouv.fr/api/1/datasets/r/f5678ab2-c863-4b48-ba1f-9021c7d97634
          fr-nantes https://www.data.gouv.fr/api/1/datasets/r/65bdd7e4-a8e7-4a54-893a-808e71c34d68
          fr-strasbourg https://www.data.gouv.fr/api/1/datasets/r/eeea9e52-4f8a-459e-aef5-a093a3b05356
          fr-bordeaux https://www.data.gouv.fr/api/1/datasets/r/10b87ffe-e6bb-494d-93df-bb6019e223d9
          fr-paris https://www.data.gouv.fr/api/1/datasets/r/d34a4b53-5d6d-41b5-9cd9-bb738637b7e9
          fr-lyon https://www.data.gouv.fr/api/1/datasets/r/abebedc6-28cf-4e2e-9c64-db57a40156f8
          fr-toulouse https://www.data.gouv.fr/api/1/datasets/r/64318177-f5b5-4144-a6be-2d0f22d26c77
          fr-montpellier https://www.data.gouv.fr/api/1/datasets/r/93a29ce2-cfc8-44ff-b712-bcfd814b7f00
          fr-rennes https://www.data.gouv.fr/api/1/datasets/r/0644f537-575e-4cce-9570-06165d6f3b27 https://www.data.gouv.fr/api/1/datasets/r/ef4779c4-d066-40d8-b8d9-fb8c7eea8820
          FEEDS
          if [ -n "$failed" ]; then echo "::error::French feeds failed:$failed"; exit 1; fi
