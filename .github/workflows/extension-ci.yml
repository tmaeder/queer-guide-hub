name: Extension CI

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "workers/submit/**"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    paths:
      - "extension/**"
      - "workers/submit/**"
      - ".github/workflows/extension-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

# Superseded checks do not need to finish on an older commit.
concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "20" }
      - run: npm install
        working-directory: workers/submit
      - run: npx tsc --noEmit
        working-directory: workers/submit
      - run: npm test
        working-directory: workers/submit

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "20" }
      - run: npm install
        working-directory: extension
      - run: npx tsc --noEmit
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-dist
          path: extension/dist
          retention-days: 14
