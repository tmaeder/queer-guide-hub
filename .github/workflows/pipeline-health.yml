name: Pipeline Health Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Verify pipeline runs (last 24h)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Load-bearing, and its absence is why this workflow was red 2026-10-13
      # to 2026-10-15. redirect-webhooks-dispatch/tests/tls.test.ts reads
      # tmp/webhook-tls/{ca,cert,key}.pem, tmp/ is gitignored, and the step
      # below runs the tree BY DISCOVERY — so it picks that file up and
      # Deno.readTextFile throws. b27ade3ec ("prepare disposable webhook TLS
      # fixtures in CI and deploy checks") added this step to ci.yml and
      # deploy-supabase-functions.yml and missed this third caller of the same
      # discovery suite.
      #
      # The cost was not two red tests: "Check pipeline health" below has no
      # continue-on-error and follows a failed step, so it was SKIPPED on every
      # nightly run for three days — the sentinel sweep this workflow exists
      # for was not running at all, and because it gates no PR nothing
      # surfaced it. Any future workflow running the suite by discovery needs
      # this step too.
      #
      # Needs no npm ci and no setup-node: the script imports only node:fs and
      # node:child_process and shells out to openssl, both present on the
      # runner, and --prepare-only returns before the live-dispatch half.
      - name: Prepare disposable redirect webhook TLS certificates
        run: node scripts/test-redirect-webhooks.mjs --prepare-only

      - name: Run Deno unit tests
        # Whole tree by discovery, matching ci.yml + deploy-supabase-functions.yml.
        # This job differs from those two in one way that matters: it sets real
        # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY at job level, so tests that
        # self-skip in PR CI actually run here, against prod. Audited before
        # widening: pipeline-nodes.test.ts is the ONLY test that reads either var
        # (`const skip = !BASE || !KEY`) and it was already in the old list; every
        # one of its invocations passes `dry_run: true`. No other test constructs a
        # Supabase client, calls fetch(), or issues an insert/update/upsert/delete,
        # so widening adds reads and pure logic only — no new prod writes.
        # ai-gateway.test.ts does Deno.env.delete(), but only of AI_GATEWAY_*/
        # CF_ACCOUNT_ID — it cannot clear the creds this job depends on.
        #
        # --node-modules-dir=none: the root package.json puts Deno in npm mode and
        # this job never runs `npm ci`, so the moment the graph reaches an `npm:`
        # specifier (_shared/email.ts, _shared/sentry.ts) it would demand a
        # node_modules/. The old 3-file list never reached one.
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --allow-read --node-modules-dir=none

      - name: Check pipeline health
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-pipeline-health.mjs

      - name: Skip health check (missing secrets)
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not set — skipping pipeline health check. Configure repo secrets to enable."
