name: Lint & a11y gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/a11y-*.spec.ts'
      - 'e2e/focus-visible.spec.ts'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - 'scripts/a11y-axe-scan.mjs'
      - 'scripts/a11y-routes.mjs'
      - '.github/workflows/a11y.yml'
  # Deliberately NOT path-filtered: "Playwright + axe a11y suite" is a REQUIRED
  # status check on main, and a required check skipped by a `paths:` filter never
  # reports, which GitHub treats as permanently pending — making any PR outside
  # the filter unmergeable forever (admin-enforced, so no bypass). The filter now
  # lives in the `changes` job below. `push` keeps its filter: it gates nothing.
  pull_request:
  # Merge queue: a required check that never reports on the merge_group event
  # leaves the queued PR pending forever. Same failure this repo already hit
  # twice with `paths:` filters on required checks.
  merge_group:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (leave empty to build the PR locally and test on http://localhost:4173)'
        required: false
        default: ''

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# BASE_URL resolution:
#   * workflow_dispatch with input → use the input (manual override)
#   * schedule (cron)              → hit prod (https://queer.guide)
#   * push / pull_request          → build the PR locally and test
#                                    http://localhost:4173, so PRs are
#                                    actually gated against their own code
#                                    instead of stale prod
env:
  RESOLVED_BASE_URL: >-
    ${{
      inputs.base_url != '' && inputs.base_url
      || (github.event_name == 'schedule' && 'https://queer.guide')
      || 'http://localhost:4173'
    }}

jobs:
  # Replaces the old trigger-level `paths:` filter for pull_request events.
  # Non-PR events (schedule / push / workflow_dispatch) are always relevant.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} event - always relevant."
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^(src/|e2e/a11y-.*\.spec\.ts$|e2e/focus-visible\.spec\.ts$|eslint\.config\.js$|playwright\.config\.ts$|scripts/a11y-axe-scan\.mjs$|scripts/a11y-routes\.mjs$|\.github/workflows/a11y\.yml$|\.github/actions/setup-playwright/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Relevant paths changed - running the a11y gate."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No a11y-relevant paths changed - skipping scans, reporting success."
          fi

  build:
    name: Build (artifact for a11y jobs)
    needs: [changes]
    if: >-
      needs.changes.outputs.relevant == 'true' && (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.base_url == '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
        env:
          HUSKY: '0'
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_BASEMAP_ASSETS_URL: 'https://protomaps-tiles.maeder-tobiassimon.workers.dev/basemaps-assets'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  jsx-a11y-lint:
    name: Lint (eslint .)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned to match ci.yml's lint job: on newer node 22.x the eslint
          # flat-config loader crashes with ERR_INTERNAL_ASSERTION while
          # importing the CJS eslint.config.js (nightly reds 2026-07-19..21).
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'
      - run: npm run lint

  axe-playwright:
    # REQUIRED status check on main — must always report, so it runs even when
    # nothing a11y-relevant changed and simply skips its steps in that case.
    # Do NOT add a trigger-level path filter or a job-level relevance `if:` here;
    # either one makes this check never report and blocks every unrelated PR.
    name: Playwright + axe a11y suite
    needs: [changes, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || (github.event_name == 'schedule' && 'https://queer.guide') || 'http://localhost:4173' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Skip notice
        if: needs.changes.outputs.relevant != 'true'
        run: echo "::notice::No a11y-relevant paths changed - reporting success without scanning."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
        if: needs.changes.outputs.relevant == 'true'
        env:
          HUSKY: '0'
      - uses: ./.github/actions/setup-playwright
        if: needs.changes.outputs.relevant == 'true'
      - name: Download dist
        if: needs.changes.outputs.relevant == 'true' && needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Serve dist on :4173
        if: needs.changes.outputs.relevant == 'true' && needs.build.result == 'success'
        run: |
          npx -y serve@14 -s dist -l 4173 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "serve up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::serve did not become ready"; cat serve.log; exit 1
      - run: npx playwright test e2e/a11y-admin.spec.ts e2e/a11y-events.spec.ts e2e/a11y-header.spec.ts e2e/a11y-dialogs.spec.ts e2e/focus-visible.spec.ts --workers=1
        if: needs.changes.outputs.relevant == 'true'
      - if: always() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 14

  axe-route-sweep:
    name: axe full route sweep
    needs: [changes, build]
    if: >-
      always() && needs.changes.outputs.relevant == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    # 160 scans. Sequential they took ~24 min and this job — then capped at 20 —
    # was killed at scan 130 on EVERY run, so it never wrote a report and never
    # reached the gate step below. SCAN_CONCURRENCY brings it to roughly a third
    # of that; the cap keeps headroom rather than tracking the new runtime.
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || (github.event_name == 'schedule' && 'https://queer.guide') || 'http://localhost:4173' }}
      # Whole public manifest × desktop+mobile, with the 320px reflow gate
      # folded into the mobile pass. OUT_NAME must match the file the gate step
      # below reads.
      #
      # LIGHT ONLY since the 2026-08-09 subway-map rebrand removed dark mode:
      # the `.dark` block is gone from src/index.css, ThemeProvider hard-reports
      # light, and the pre-paint script in index.html strips the class. The dark
      # pass set `ui-theme=dark` (which the app now deletes) and emulated a dark
      # colour-scheme, so it rendered a state NO user can reach — and duly
      # reported a contrast failure on /villages/adams-point that does not exist
      # in the product. Scanning it would mean maintaining contrast for an
      # unreachable render forever.
      #
      # If dark mode ever returns, restore `light,dark` here in the same change
      # that reintroduces the `.dark` token block.
      SCAN_SCOPE: public
      SCAN_VIEWPORTS: desktop,mobile
      SCAN_THEMES: light
      SCAN_CONCURRENCY: '4'
      OUT_NAME: axe-postdeploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
        env:
          HUSKY: '0'
      - uses: ./.github/actions/setup-playwright
      - name: Download dist
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Serve dist on :4173
        if: needs.build.result == 'success'
        run: |
          npx -y serve@14 -s dist -l 4173 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "serve up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::serve did not become ready"; cat serve.log; exit 1
      - run: node scripts/a11y-axe-scan.mjs
      - name: Fail on serious/critical
        run: |
          # `complete` and the base-URL check are load-bearing: docs/a11y-audit/
          # axe-postdeploy.json is a COMMITTED file, so a run that dies before
          # writing leaves April's clean prod scan on disk and this gate would
          # pass on it. Assert the report is this run's before trusting it.
          node -e "
            const r=require('./docs/a11y-audit/axe-postdeploy.json');
            if(r.complete!==true){console.error('Report is partial or stale:',r.scanned,'of',r.expected,'scans; baseUrl',r.baseUrl);process.exit(1)}
            if(r.baseUrl!==process.env.BASE_URL){console.error('Report baseUrl',r.baseUrl,'!=',process.env.BASE_URL);process.exit(1)}
            // Keep route + variant through the flatten. Without them the
            // failure line was a rule and a CSS selector with no page and no
            // viewport attached, so diagnosing one meant correlating it against
            // the per-route '… N violations' line minutes earlier in the log —
            // and then rebuilding the whole environment to guess the rest.
            const bad=r.results.flatMap(x=>(x.violations||[])
              .filter(v=>v.impact==='serious'||v.impact==='critical')
              .map(v=>({...v, route:x.route, variant:x.variant})));
            if(bad.length){
              console.error('Found',bad.length,'serious/critical\n');
              for(const v of bad.slice(0,10)){
                const n=v.sample?.[0]||{};
                console.error(\`  \${v.route} [\${v.variant}] — \${v.id} (\${v.impact}) ×\${v.nodes}\`);
                console.error(\`    \${v.help}\`);
                if(n.target) console.error(\`    target: \${JSON.stringify(n.target)}\`);
                if(n.html) console.error(\`    html:   \${String(n.html).replace(/\s+/g,' ').slice(0,160)}\`);
                // The failure summary is the part that says WHY — for
                // color-contrast it carries the measured ratio and both colours,
                // which is the difference between a fix and a guess.
                if(n.failureSummary) console.error('    why:    '+String(n.failureSummary).replace(/\n/g,' | ').slice(0,300));
                // target-size records the rect, the scroll offset and what is
                // sitting on top of the target (see the scanner). Without it
                // the summary's \"smallest space is 14px by 44px\" names no
                // culprit, which is exactly the finding that could not be
                // diagnosed from this log.
                if(n.geometry) console.error('    where:  '+JSON.stringify(n.geometry));
                console.error(\`    docs:   \${v.helpUrl}\`);
              }
              if(bad.length>10) console.error(\`  … and \${bad.length-10} more — see the axe-postdeploy artifact\`);
              process.exit(1);
            }
            console.log('Clean:',r.scanned,'scans, 0 serious/critical');
          "
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-postdeploy
          path: |
            docs/a11y-audit/axe-postdeploy.json
            docs/a11y-audit/axe-postdeploy.md

  lighthouse:
    name: Lighthouse a11y >= 95
    needs: [changes, build]
    if: >-
      always() && needs.changes.outputs.relevant == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || (github.event_name == 'schedule' && 'https://queer.guide') || 'http://localhost:4173' }}
      ROUTE: ${{ matrix.route }}
    strategy:
      fail-fast: false
      matrix:
        route: ['/', '/events', '/venues', '/places', '/news', '/marketplace', '/trips/discover', '/submit', '/cities', '/hotels', '/personalities', '/help', '/pride']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm i -g lighthouse@12 serve@14
      - name: Download dist
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Serve dist on :4173
        if: needs.build.result == 'success'
        run: |
          serve -s dist -l 4173 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "serve up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::serve did not become ready"; cat serve.log; exit 1
      - name: Lighthouse a11y
        run: |
          mkdir -p lh
          slug=$(printf '%s' "$ROUTE" | sed 's|/|_|g; s|^_||')
          [ -z "$slug" ] && slug=home
          # Retry Lighthouse on transient runtime errors (NO_FCP etc.) when
          # headless Chrome on a GitHub runner doesn't paint in time. The
          # score check below is unchanged.
          attempt=1
          until lighthouse "${BASE_URL}${ROUTE}" \
            --only-categories=accessibility \
            --output=json --output-path="lh/${slug}.json" \
            --chrome-flags="--no-sandbox --disable-gpu --disable-dev-shm-usage --disable-software-rasterizer --headless=new --window-size=1350,940" \
            --preset=desktop \
            --max-wait-for-load=90000 \
            --quiet; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Lighthouse failed after 3 attempts for $ROUTE"
              exit 1
            fi
            echo "Lighthouse attempt $attempt failed for $ROUTE; retrying" >&2
            attempt=$((attempt+1))
            sleep 5
          done
          # Recompute score excluding audits we accept by design:
          #   link-in-text-block — handled via the inline-link underline rule
          #     in src/index.css; also disabled in axe specs.
          #   target-size — only persistent failure is the maplibre attribution
          #     toggle, a third-party widget control.
          score=$(node -e "
            const r=require('./lh/'+process.argv[1]+'.json');
            const skip=new Set(['link-in-text-block','target-size']);
            const refs=r.categories.accessibility.auditRefs.filter(x=>!skip.has(x.id));
            let earned=0,total=0;
            for(const ref of refs){
              const a=r.audits[ref.id];
              if(a.score===null) continue;
              total+=ref.weight;
              earned+=ref.weight*a.score;
            }
            console.log(total?Math.round(earned/total*100):100);
          " "$slug")
          echo "Lighthouse a11y (excl. link-in-text-block, target-size) for $ROUTE: $score"
          if [ "$score" -lt 95 ]; then
            echo "::error::Lighthouse a11y score $score < 95 for $ROUTE"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ strategy.job-index }}
          path: lh/
