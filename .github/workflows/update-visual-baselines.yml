name: Update Visual Baselines

# Regenerates the Playwright visual-regression baselines on the SAME platform
# the nightly suite runs on (ubuntu / amd64-linux), so the committed baselines
# always match CI's exact browser build. Run this whenever the UI changes
# intentionally. With commit=true (default) the regenerated *-linux.png
# baselines are committed straight to the dispatched branch; they are also
# uploaded as an artifact either way.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to screenshot'
        required: false
        default: 'https://queer.guide'
      commit:
        description: 'Commit regenerated baselines to the dispatched branch'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  # Needed for the protected-branch fallback below, which opens a PR instead of
  # pushing. Note a GITHUB_TOKEN-authored PR does not trigger CI, so its required
  # checks stay pending until a human pushes to the branch or re-runs them —
  # acceptable for a baselines-only change, but do not expect auto-merge.
  pull-requests: write

jobs:
  update-baselines:
    name: Regenerate linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate visual baselines
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://queer.guide' }}
        # --update-snapshots writes the new baselines and exits non-zero when
        # any snapshot changed (Playwright 1.52+ "update but flag" behaviour),
        # so don't fail the job on that.
        run: |
          npx playwright test \
            e2e/visual-top10.spec.ts \
            e2e/visual-mobile.spec.ts \
            e2e/design-system.spec.ts \
            --update-snapshots --reporter=line || true
      - name: Upload regenerated linux baselines
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines
          path: |
            e2e/**/*-linux.png
          if-no-files-found: error
          retention-days: 7
      # `main` is protected, so a direct push from GITHUB_TOKEN is rejected with
      # GH006 ("N of N required status checks are expected") — and it is rejected
      # at the LAST step, after ~28 minutes of screenshotting, so the run looks
      # like it is working right up until it isn't. Dispatching on main is the
      # obvious thing to do after an intentional UI change, so route that case
      # through a PR rather than failing.
      - name: Commit baselines
        if: inputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_URL: ${{ inputs.base_url || 'https://queer.guide' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/*-snapshots/*-linux.png
          if git diff --cached --quiet; then
            echo "baselines unchanged — nothing to commit"
            exit 0
          fi

          # skip-checks trailer, not "[skip ci]" — a bracket marker anywhere in a
          # squashed merge message skips ALL deploys (see the CLAUDE.md gotcha).
          git commit -m "test(e2e): update linux visual baselines" -m "skip-checks: true"

          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            BRANCH="chore/visual-baselines-$(date -u +%Y%m%d-%H%M%S)"
            git push origin "HEAD:refs/heads/${BRANCH}"
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${BRANCH}" \
              --title "test(e2e): update linux visual baselines" \
              --body "Regenerated against \`${BASE_URL}\` by the Update Visual Baselines workflow. Direct pushes to \`${DEFAULT_BRANCH}\` are blocked by branch protection, so this lands as a PR."
            echo "::notice::baselines pushed to ${BRANCH} and a PR opened (cannot push to protected ${DEFAULT_BRANCH})"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
