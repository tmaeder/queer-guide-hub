name: SEO Check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to check
        required: false
        default: https://queer.guide
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: [Deploy to Cloudflare Pages]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run SEO check
        env:
          INPUT_BASE: ${{ github.event.inputs.base_url }}
        run: |
          BASE="${INPUT_BASE:-https://queer.guide}"
          node scripts/seo-check.mjs "$BASE"

      # Separate step so a hub losing its crawl links is named as that, rather
      # than folded into a generic SEO failure. It has to run post-deploy: the
      # production failure mode is a missing SUPABASE_URL on the Pages project,
      # which makes buildHubLinksHtml return '' and the page keep serving 200
      # with no links — invisible to any unit test with a mocked fetch.
      - name: Check hub crawl links
        env:
          INPUT_BASE: ${{ github.event.inputs.base_url }}
        run: |
          BASE="${INPUT_BASE:-https://queer.guide}"
          node scripts/seo-hub-links.mjs "$BASE"
