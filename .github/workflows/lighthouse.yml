name: Lighthouse CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  workflow_run:
    workflows: [Deploy to Cloudflare Pages]
    types: [completed]
    branches: [main]
concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    name: audit (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Budgets live in the rc files and are a ratchet: set at measured prod
        # values plus a margin, and only ever tightened.
        include:
          - form_factor: mobile
            config: lighthouserc.json
          - form_factor: desktop
            config: lighthouserc.desktop.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install Lighthouse CI
        run: npm install -g "@lhci/cli@0.13.x"
      - name: Collect
        run: lhci collect --config=${{ matrix.config }}
      - name: Assert budgets
        run: lhci assert --config=${{ matrix.config }}
      - name: Write filesystem report
        if: always()
        run: lhci upload --config=${{ matrix.config }} || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Non-blocking: storing a diagnostic report must not fail a job whose
        # assertions already passed. See the long note in a11y.yml — GitHub's
        # artifact service returned a persistent 403 on FinalizeArtifact on
        # 2026-09-08 and turned green test runs into red required checks.
        # Deliverable artifacts (dist, dist-static, extension zips, generated
        # baselines) are deliberately NOT given this treatment.
        continue-on-error: true
        with:
          name: lighthouse-reports-${{ matrix.form_factor }}
          path: .lighthouseci/
          # .lighthouseci is a dot-dir; upload-artifact v4+ skips hidden files
          # by default, so without this the reports were never uploaded.
          include-hidden-files: true
          retention-days: 30
