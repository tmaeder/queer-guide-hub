# Isolated diagnostic branch only. Never merge this over production Lighthouse.
name: Lighthouse preview diagnostic
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Immutable project Pages preview origin
        required: false
      expected_sha:
        description: Exact clean preview source commit
        required: true
      build_preview:
        description: Build only the reviewed candidate on an isolated preview branch
        type: boolean
        default: false
concurrency:
  group: lighthouse-preview-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-preview:
    if: ${{ inputs.build_preview }}
    name: Build immutable candidate preview (no production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Fence the exact reviewed candidate branch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin codex/public-offscreen-work-20261029 --depth=1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Build the reviewed source
        run: npm run build
        env:
          CF_PAGES_COMMIT_SHA: ${{ inputs.expected_sha }}
          VITE_AMBIENT_TRIP_RELEASE: ${{ vars.VITE_AMBIENT_TRIP_RELEASE || '1' }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Keep private source maps out of the preview
        run: find dist -type f -name '*.map' -delete
      - name: Deploy only to the isolated preview branch
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: pages deploy dist --project-name queer-guide --branch codex-public-offscreen-preview-20261029 --commit-hash ${{ inputs.expected_sha }} --commit-message "Reviewed offscreen performance preview" --commit-dirty=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-preview-dist
          path: dist/
          retention-days: 14
  audit:
    if: ${{ !inputs.build_preview }}
    name: audit (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QG_PREVIEW_URL: ${{ inputs.preview_url }}
      QG_PREVIEW_EXPECTED_SHA: ${{ inputs.expected_sha }}
      QG_PREVIEW_PROFILE: ${{ matrix.form_factor }}
    strategy:
      fail-fast: false
      matrix:
        # Budgets live in the rc files and are a ratchet: set at measured prod
        # values plus a margin, and only ever tightened.
        include:
          - form_factor: mobile
            config: lighthouserc.json
          - form_factor: desktop
            config: lighthouserc.desktop.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install Lighthouse CI
        run: npm install -g "@lhci/cli@0.13.x"
      - name: Preserve original budgets and map only preview origins
        run: node scripts/lighthouse-preview-probe.mjs prepare
      - name: Verify immutable preview source before collection
        run: node scripts/lighthouse-preview-probe.mjs verify before
      - name: Collect
        # Save trace/devtools artifacts after each audit for task attribution.
        # This reporter flag changes no audit, throttling, device or budget.
        run: lhci collect --config=.preview-lhci-${{ matrix.form_factor }}.json --settings.saveAssets=true
      - name: Assert budgets
        # No-index preview SEO failures intentionally remain visible as errors.
        run: lhci assert --config=.preview-lhci-${{ matrix.form_factor }}.json
      - name: Verify immutable preview source after collection
        if: always()
        run: node scripts/lighthouse-preview-probe.mjs verify after
      - name: Write filesystem report
        if: always()
        run: lhci upload --config=.preview-lhci-${{ matrix.form_factor }}.json || true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Non-blocking: storing a diagnostic report must not fail a job whose
        # assertions already passed. See the long note in a11y.yml — GitHub's
        # artifact service returned a persistent 403 on FinalizeArtifact on
        # 2026-09-08 and turned green test runs into red required checks.
        # Deliverable artifacts (dist, dist-static, extension zips, generated
        # baselines) are deliberately NOT given this treatment.
        continue-on-error: true
        with:
          name: preview-lighthouse-${{ matrix.form_factor }}
          path: |
            .lighthouseci/
            .preview-lhci-*.json
            lhci-preview-*.json
            *-*.trace.json
            *-*.devtoolslog.json
          # .lighthouseci is a dot-dir; upload-artifact v4+ skips hidden files
          # by default, so without this the reports were never uploaded.
          include-hidden-files: true
          retention-days: 30
