name: Search Console Report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
concurrency:
  group: search-console-report
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generate weekly report
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
        run: node scripts/search-console-report.mjs
      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No new report to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore(seo): weekly Search Console report"
          # Rebase-and-retry rather than a bare `git push`. main merges roughly
          # every 15-20 minutes in this repo, so the window between checkout and
          # push is wide enough to lose regularly — and losing means the report
          # was generated, the run went red, and the data was thrown away. The
          # report only ever ADDS a file under reports/, so a rebase cannot
          # conflict with anyone.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the new main"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "::error::rebase failed; not retrying blindly"
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "::error title=Search Console report::generated the report but could not push it after 5 attempts"
          exit 1
