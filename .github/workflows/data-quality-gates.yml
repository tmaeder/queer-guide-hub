name: Data Quality Gates

# Trust-&-safety release gates (audit 2026-06-05 §4). Blocks a PR if any CRITICAL
# data-quality gate regresses (e.g. an unconsented identity label re-enters the
# public corpus, a crisis hotline goes silently unverified, a criminalizing
# country is shown "safe", or a duplicate pointer dangles/chains).

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Critical data-quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Run release_gate_checks()
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-data-quality-gates.mjs

      # Stock ALTER DEFAULT PRIVILEGES grants anon/authenticated write on every new
      # view, which silently bypasses RLS on any SECURITY DEFINER view. Runs even if
      # the gate above fails, so both reports land in a single run.
      - name: No API-role writes on SECURITY DEFINER views
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-definer-view-grants.mjs

      # RLS on `profiles` filters rows, not columns, so the anon column ACL is the only
      # thing protecting email / date_of_birth / kink_interests. A blanket
      # `GRANT SELECT ON ALL TABLES ... TO anon` re-exposes all 173 columns without
      # touching a single column ACL — this asserts the table grant stays absent.
      - name: anon cannot read profiles beyond the column allowlist
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-profile-column-grants.mjs

      # Stock ALTER DEFAULT PRIVILEGES also grants EXECUTE on every new FUNCTION to anon —
      # how 97 admin/cron RPCs became anon-callable (20260822100000). The database cannot
      # be made fail-closed here: ALTER DEFAULT PRIVILEGES cannot subtract the built-in
      # EXECUTE-to-PUBLIC, and an event trigger needs superuser. So CI catches the 98th.
      - name: anon cannot call write-capable SECURITY DEFINER functions
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-anon-function-grants.mjs

      # Tag data-quality ratchet. Phase 0 of the tag DQ program fixed the corpus
      # while the image gaps GREW underneath it (image-without-license 1,167 ->
      # 1,215 in a day, image-without-alt likewise) because nothing was watching.
      # Fails only when a defect count grows past scripts/tag-hygiene-baseline.json,
      # so the existing backlog does not block unrelated PRs but the next
      # regression does.
      - name: Tag hygiene has not regressed
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-tag-hygiene.mjs

      # The published legal citations on /tags/:slug are external URLs on other
      # people's servers, and they rot. NOT run on pull_request on purpose: the
      # failure lives on third-party hosts, so wiring it to PRs would let a UN
      # outage block every unrelated PR in the repo. Daily is the right resolution
      # for documents that change on the order of years.
      - name: Published legal citations still resolve
        if: ${{ !cancelled() && github.event_name != 'pull_request' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/check-legal-citation-links.mjs

      - name: Skip (missing secrets)
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — skipping data-quality gates. Configure repo secrets to enable."
