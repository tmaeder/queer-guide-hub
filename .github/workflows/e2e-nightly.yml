name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://queer.guide'

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-suite:
    name: Full Playwright suite
    runs-on: ubuntu-latest
    # A job killed by this budget reports as `cancelled`, NOT `failure` — which
    # is why the 2026-08-15 and 2026-08-19 nightlies read as someone cancelling
    # them by hand. Check the duration before believing a cancellation: 45m16s
    # against a 45m budget is a timeout.
    #
    # Raised 45 -> 75 on 2026-08-19. The admin secrets (E2E_ADMIN_EMAIL /
    # _PASSWORD) started resolving between the 08-18 and 08-19 runs, which un-
    # skipped the admin-authenticated specs: 620 -> 653 tests and 104 -> ~40
    # skips. At `workers: 1` (deliberate — this suite runs against PRODUCTION,
    # so concurrency here is load on the live site) plus `retries: 2`, every
    # failing test costs 3 executions, and the run no longer fits in 45m.
    timeout-minutes: 75
    env:
      BASE_URL_INPUT: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - name: Run e2e suite
        env:
          E2E_BASE_URL: ${{ env.BASE_URL_INPUT || 'https://queer.guide' }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
