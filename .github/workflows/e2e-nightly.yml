name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://queer.guide'
      test_file:
        description: 'Optional e2e/*.spec.ts file for a focused production run'
        required: false
        default: ''

concurrency:
  # A focused production retest must not cancel the long full-suite run.
  # Keep focused retests serialized with each other and full suites with each
  # other, allowing at most those two classes of production verification.
  group: e2e-nightly-${{ inputs.test_file && 'focused' || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-suite:
    name: Full Playwright suite
    runs-on: ubuntu-latest
    # A job killed by this budget reports as `cancelled`, NOT `failure` — which
    # is why the 2026-08-15 and 2026-08-19 nightlies read as someone cancelling
    # them by hand. Check the duration before believing a cancellation: 45m16s
    # against a 45m budget is a timeout.
    #
    # Raised 45 -> 75 on 2026-08-19. The admin secrets (E2E_ADMIN_EMAIL /
    # _PASSWORD) started resolving between the 08-18 and 08-19 runs, which un-
    # skipped the admin-authenticated specs: 620 -> 653 tests and 104 -> ~40
    # skips. At `workers: 1` (deliberate — this suite runs against PRODUCTION,
    # so concurrency here is load on the live site) plus `retries: 2`, every
    # failing test costs 3 executions, and the run no longer fits in 45m.
    # The suite now has ~1,600 tests. The 2026-10-28 run hit 75m after
    # completing only 1,335 of 1,582 tests. Keep one worker against production;
    # give the test step its own deadline so report upload retains headroom.
    timeout-minutes: 120
    env:
      BASE_URL_INPUT: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - name: Run e2e suite
        timeout-minutes: 110
        env:
          E2E_BASE_URL: ${{ env.BASE_URL_INPUT || 'https://queer.guide' }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_TEST_FILE: ${{ inputs.test_file }}
        run: |
          set -o pipefail
          {
            if [[ -n "$E2E_TEST_FILE" ]]; then
              if [[ ! "$E2E_TEST_FILE" =~ ^e2e/[A-Za-z0-9._/-]+\.spec\.ts$ ]]; then
                echo "::error::test_file must be an e2e/*.spec.ts path"
                exit 1
              fi
              npx playwright test e2e/auth.setup.ts "$E2E_TEST_FILE"
            else
              npm run test:e2e
            fi
          } 2>&1 | tee playwright-run.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Non-blocking: storing a diagnostic report must not fail a job whose
        # assertions already passed. See the long note in a11y.yml — GitHub's
        # artifact service returned a persistent 403 on FinalizeArtifact on
        # 2026-09-08 and turned green test runs into red required checks.
        # Deliverable artifacts (dist, dist-static, extension zips, generated
        # baselines) are deliberately NOT given this treatment.
        continue-on-error: true
        with:
          name: playwright-report
          # The console log and per-test files exist before HTML generation,
          # so an interrupted run still leaves assertion errors and screenshots.
          path: |
            playwright-report/
            test-results/
            playwright-run.log
          retention-days: 14
