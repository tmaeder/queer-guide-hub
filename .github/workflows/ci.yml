name: CI

# Per-PR correctness gate. Independent jobs run in parallel:
# typecheck, lint, frontend unit tests, scraper tests, worker tests,
# and edge-function deno tests. Each is a hard fail on the PR check.
# Bundle-shape and a11y gates live in their own workflows
# (bundle-shape.yml, a11y.yml) with narrower path filters; this one
# runs on every PR so anything that breaks tsc/eslint/tests is caught
# before review.

on:
  pull_request:
  # Merge queue: a required check that never reports on the merge_group event
  # leaves the queued PR pending forever. Same failure this repo already hit
  # twice with `paths:` filters on required checks.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  # For scripts/check-open-pr-migrations.mjs, which lists OTHER open PRs and
  # their changed files to catch a migration version two branches both claim.
  # Read-only: the check reports, it never renumbers or comments.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Native isolated cluster; never connects to an application database.
      # Ubuntu 24.04 ships PG16. Local/prod verification also covers PG17.
      PG_BIN: /usr/lib/postgresql/16/bin
      PG_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run test:merge-policy
      - name: Snapshot fixture locality and anonymous-data contracts
        run: node --test scripts/ci/snapshot-fixtures.test.mjs
      - name: Review resolution source, ownership and composition fixtures
        run: |
          set -euo pipefail
          for fixture in \
            run_publisher_occurrence_copy.py \
            run_news_source_recovery.py \
            run_source_venue_recovery.py \
            run_source_event_formats.py \
            run_exact_news_source_duplicates.py \
            run_review_city_context.py \
            run_event_calendar_recovery.py \
            run_publisher_venue_websites.py \
            run_city_identity_recovery.py \
            run_city_refresh.py \
            run_profiles_social_grants.py \
            run_jev_review.py \
            run_jev_budget.py \
            run_jev_marketplace_taxonomy.py \
            run_jev_marketplace_relevance.py \
            run_review_cleanup_composition.py \
            run_snapshot_backend_grants.py; do
            python3 "supabase/tests/isolated/$fixture"
          done

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # Real check of the whole app (tsconfig.app.json) with a baseline ratchet:
      # ~1400 pre-existing errors are recorded in scripts/typecheck-baseline.json
      # and only NEW ones fail. Until 2026-07-29 this step was bare `tsc --noEmit`
      # against the solution-style root tsconfig ("files": [] + references), which
      # without `-b` compiles zero files and always exits 0 — vacuously green.
      - run: npm run typecheck
      # Cloudflare Pages Functions were covered by NO tsconfig until 2026-08-01
      # (tsconfig.app.json is "include": ["src"]), so a type error in the edge
      # middleware that serves crawler meta, branding and sitemaps only ever
      # surfaced in production. Zero-tolerance — it starts at 0 errors.
      - run: npm run typecheck:functions

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: |
          node scripts/sync-redirect-inventory-manifest.mjs
          npm run lint
      # Cloudflare Pages silently ignores config it cannot accept: _redirects
      # rules with an illegal status or a self-looping rewrite target, and a
      # missing _routes.json (which leaves the Functions bundle unrouted, so
      # every Pages Function 404s). Both shipped green on 2026-08-01.
      - run: npm run check:pages-routing
      # Every install here runs --no-audit, so nothing else looks at advisories
      # between Dependabot PRs. Ratchet against scripts/npm-audit-baseline.json:
      # a NEW high/critical prod advisory fails; a baselined one that goes away
      # fails too until its entry is deleted (shrink-only).
      - name: npm audit (production deps, high+)
        run: npm run check:npm-audit
      # functions/** (Pages edge middleware) was outside Prettier/lint-staged and
      # drifted; this keeps it formatted now that lint-staged covers it too.
      - name: Prettier check (functions/)
        run: npm run format:check:functions

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # These server regressions have their own Node config. Execute once;
      # failure of this shard also fails the required aggregate test job.
      - name: Run merchant and server-script regressions
        if: matrix.shard == 1
        run: npm run test:merchant-sync
      - name: Run Jev provider backpressure regressions
        if: matrix.shard == 1
        run: node --import tsx --test scripts/ci/jev-review-runtime.test.ts scripts/ci/jev-validation-runtime.test.ts scripts/ci/jev-pipeline-gate-runtime.test.ts scripts/ci/marketplace-relevance-runtime.test.ts supabase/functions/_shared/jev-client.test.ts supabase/functions/_shared/jev-evidence-judgments.test.ts supabase/functions/_shared/jev-pipeline-judgments.test.ts supabase/functions/marketplace-relevance/decision.test.ts
      - name: Collect unit results and coverage
        run: |
          npm run test:coverage -- \
            --shard "$SHARD_INDEX/4" \
            --reporter=default --reporter=blob \
            --outputFile.blob=".unit-test-reports/blobs/blob-$SHARD_INDEX.json" \
            --coverage.reporter=json-summary \
            --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.functions=0
          node scripts/ci/unit-shard-reports.mjs write .unit-test-reports "$SHARD_INDEX/4" "$GITHUB_SHA"
      # These are gate inputs, unlike the optional diagnostic report below.
      # Failed, cancelled, missing or substituted inputs cannot pass test.
      - name: Upload required shard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-shard-${{ matrix.shard }}
          path: .unit-test-reports/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Preserve the branch-protection check name. All tests run across the four
  # shards; the original coverage thresholds run once on their complete union.
  test:
    if: always()
    needs: [unit-test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARD_RESULT: ${{ needs.unit-test-shards.result }}
    steps:
      - name: Require every unit shard to succeed
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::A unit shard failed, was cancelled or did not run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Download all required shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unit-test-shard-*
          path: .unit-test-reports
          merge-multiple: true
      - name: Validate complete evidence from this commit
        run: node scripts/ci/unit-shard-reports.mjs verify-inputs .unit-test-reports 4 "$GITHUB_SHA"
      - name: Enforce combined coverage and complete test discovery
        run: |
          npx vitest list --filesOnly --json=.unit-test-reports/expected-files.json
          npm run test:coverage -- --merge-reports=.unit-test-reports/blobs \
            --reporter=default --reporter=json --outputFile.json=.unit-test-reports/merged-tests.json
          node scripts/ci/unit-shard-reports.mjs verify-results \
            .unit-test-reports/expected-files.json .unit-test-reports/merged-tests.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Non-blocking: storing a diagnostic report must not fail a job whose
        # assertions already passed. See the long note in a11y.yml — GitHub's
        # artifact service returned a persistent 403 on FinalizeArtifact on
        # 2026-09-08 and turned green test runs into red required checks.
        # Deliverable artifacts (dist, dist-static, extension zips, generated
        # baselines) are deliberately NOT given this treatment.
        continue-on-error: true
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # Scraper unit tests (vitest in scraper/). Cheap to run; bugs here
  # affect daily data ingestion, so we always run on every PR rather
  # than gating on a path filter. Uses `npm install` to match the
  # established extension-ci.yml pattern for sub-package installs.
  scraper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
      - run: npm install
        working-directory: scraper
      - run: npm test
        working-directory: scraper

  # Worker tests for every workers/* that declares a `test` script.
  # workers/submit is also covered by extension-ci.yml (path-filtered);
  # running it here covers PRs that don't touch the extension paths.
  # Workers without a test script are skipped (auto-picks up new
  # workers as they bootstrap vitest setup).
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each worker's package.json is installed standalone from its own dir, so it
    # does NOT inherit the repo-root .npmrc (npm reads only $PWD/.npmrc, never a
    # parent's). That root file sets legacy-peer-deps=true to tolerate wrangler's
    # peerOptional @cloudflare/workers-types being a major behind the standalone
    # workers-types the workers depend on. Mirror it here as an env so every
    # per-worker `npm install` applies the same policy (else ERESOLVE).
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
      - name: Run tests for each worker with a test script
        # `npm install` (not `npm ci`) to match the established
        # extension-ci.yml pattern for sub-package installs.
        run: |
          set -e
          any_run=0
          for pkg in workers/*/package.json; do
            dir=$(dirname "$pkg")
            if node -e "const p=require('./$pkg'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
              echo "::group::$dir"
              (cd "$dir" && npm install && npm test)
              echo "::endgroup::"
              any_run=1
            else
              echo "Skipping $dir (no test script)"
            fi
          done
          if [ "$any_run" -eq 0 ]; then
            echo "::error::No workers/* had a test script — check this job is still doing useful work."
            exit 1
          fi

  # Migration guards. Both steps catch a way to silently kill `supabase db push`:
  #   1. duplicate 14-digit version / malformed filename (pure-local, no DB; see
  #      PR #1553 and scripts/check-migration-versions.mjs — pre-existing
  #      duplicates are grandfathered as warnings)
  #   2. a version already applied to prod with no repo file (queries remote
  #      schema_migrations; see the step comment below)
  migration-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.20.0'
      - name: Resolve migration base ref
        run: |
          BASE="${{ github.base_ref }}"
          # merge_group carries no base_ref, and HEAD~1 is not main's tip when
          # the queue batches several PRs into one group.
          if [ -z "$BASE" ] && [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE=main
          fi
          if [ -n "$BASE" ]; then
            git fetch --depth=1 origin "$BASE"
            echo "MIGRATION_BASE_REF=origin/$BASE" >> "$GITHUB_ENV"
          else
            echo "MIGRATION_BASE_REF=HEAD~1" >> "$GITHUB_ENV"
          fi
      # The token lets this step exempt versions ALREADY in remote history. A
      # migration applied via MCP is stamped with the call time, so on this
      # repo (whose migrations are future-dated) the recovered file is born
      # below max — the drift check demands the file and, without this, the
      # ordering rule refuses it. Both gates then block every PR. Without the
      # secret the step stays strict and says it could not verify.
      - name: Run node scripts/check-migration-versions.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xqeacpakadqfxjxjcewc
        run: |
          rc=0
          node scripts/check-migration-versions.mjs || rc=$?
          if [ "$rc" -eq 1 ]; then exit 1; fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Migration version check could not verify against remote history (exit $rc)."
          fi

      # CROSS-PR. The step above compares against remote history and sibling
      # worktrees. Neither can see a version claimed by a branch that exists only
      # on the remote, and the worktree half is a no-op in CI — the hole
      # check-migration-versions.mjs's own header has always named as still open:
      # "closing that needs the GitHub API (open PRs and their changed files), a
      # network dependency this guard deliberately does not have".
      #
      # Measured 2026-09-18/19: #3778 and #3779 independently claimed
      # 99800101100000, then #3783 picked 99920101100000 — the version #3779 had
      # renumbered TO inside the same hour. Every existing check was green in all
      # three, because none could see the others.
      #
      # A SEPARATE SCRIPT, deliberately, not a sixth check in the one above: that
      # file is pure-local by design (it runs in .husky/pre-push with no
      # credentials) and a GitHub dependency there would make the local hook
      # slow, flaky, or quietly degraded. Two scripts, two dependency profiles.
      #
      # Exit 2 = could not check (no token, rate limit, truncated listing). It is
      # surfaced as a warning and never as a pass — "could not look" must not
      # read as "nothing found", which is the convention every other gate here
      # follows.
      - name: Check for version collisions with other open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rc=0
          node scripts/check-open-pr-migrations.mjs || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error title=Migration version claimed by another open PR::Two open PRs claim one 14-digit version. Whichever merges first wins; the other is skipped permanently and silently, or aborts the whole db push on schema_migrations_pkey and strands every unrelated pending migration. Fix: node scripts/next-migration-version.mjs --renumber <file>"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Cross-PR migration check could not run (exit $rc) — a collision with another open PR would be invisible."
          fi

      # SYNTAX. The two checks around this one only ever look at 14-digit
      # VERSIONS, so a migration that is not valid SQL sails past both. On
      # 2026-09-14 one did: `50500101100300` ended `COMMENT ON ... IS 'a' || 'b'`,
      # and COMMENT ON takes a LITERAL, so it is a 42601. `db push` stops at the
      # first failing file and takes every migration queued behind it, which
      # broke main for four and a half hours across four deploy runs. A parse
      # error is unreachable at runtime, so no test that executes logic can find
      # it, and nothing else in this repo parses SQL.
      #
      # libpg-query is Postgres's own parser pinned to 17.x — the server version
      # this project runs — so the grammar here cannot drift from the grammar
      # db push will meet. Version comes from package.json so there is one pin.
      #
      # Scope is honest and narrow: this catches top-level syntax only. It does
      # NOT see inside a plpgsql body (the outer grammar treats $$...$$ as an
      # opaque literal) and it catches nothing semantic — the `hard-point`
      # postcondition failure the same day would still get through. One layer.
      - name: Check migrations are valid SQL
        run: |
          npm i --no-save --no-audit --no-fund \
            "libpg-query@$(node -p "require('./package.json').devDependencies['libpg-query']")"
          node scripts/check-migration-sql.mjs

      # A verify block that greps pg_get_functiondef() matches the function's own
      # COMMENTS, because pg_get_functiondef returns the body verbatim. On
      # 2026-09-20 this aborted `db push` on main THREE times in one day from
      # three different sessions — 99991789853609 (which stranded 14 migrations
      # from 00:21), 99991789855163, and a third fixed in #3862. `db push` stops
      # at the first failing migration, so the blast radius is the whole deploy
      # queue rather than one PR, and it only fails at APPLY time because CI
      # never applies migrations. Nothing else catches it.
      #
      # Both directions are wrong, which is why the rule is "strip", not "count
      # differently": an ABSENCE check goes falsely RED when a comment inflates
      # the count, and a PRESENCE check goes falsely GREEN when the symbol
      # exists only in prose — several of these assert security properties, e.g.
      # that find_duplicate_clusters still calls assert_admin_or_internal.
      #
      # Scoped to newly ADDED migrations: 17 of the 65 existing files would
      # flag, and every one of them applied successfully, so gating the history
      # would ship red with 17 entries nobody reads.
      #
      # The token is what lets it tell "added" from "new". A RECOVERY PR adds
      # files that were already applied — the same condition the scope rule
      # forgives for those 17 — and with no way to look that up this blocked
      # #3990, the PR clearing drift for every open PR in the repo. Without the
      # secret it falls back to checking every added file, i.e. the old
      # behaviour: a missing token can only make this louder, never quieter.
      - name: Migration assertions on pg_get_functiondef strip comments
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xqeacpakadqfxjxjcewc
        run: node scripts/check-functiondef-asserts.mjs

      # Remote-only versions: a migration applied to prod (MCP apply_migration or
      # raw Management-API SQL) with no committed file makes `supabase db push`
      # skip EVERYTHING — merged migrations silently never apply and nothing goes
      # red. migration-drift-monitor.yml catches it within 6h; this catches it
      # before merge. On pull_request the checkout is the MERGE commit, so the
      # question asked is the right one: would db push skip once this PR lands?
      # (A stale branch therefore does NOT false-positive — main's files are in
      # the merge tree.) Without the secret the script falls back to its
      # credential-free merge-base check; that can't see remote, so it warns.
      - name: Check for remote-only migration versions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xqeacpakadqfxjxjcewc
        run: |
          rc=0
          node scripts/check-migration-drift.mjs || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::Migration drift — a version applied to prod has no repo file. Recover the SQL from schema_migrations.statements into supabase/migrations/<version>_<name>.sql (see CLAUDE.md). Never blindly db pull."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Remote migration drift check could not run (exit $rc) — only the degraded merge-base check ran."
          fi

  # Deno tests for supabase/functions. Mirrors pipeline-health.yml's
  # known-working invocation, but runs the WHOLE tree by discovery — no
  # hardcoded file list. Until 2026-08-02 this named 7 files under _tests/,
  # so 38 of the 45 test files in the tree (every one under _shared/,
  # including the venue-consensus and amenity-normalize suites CLAUDE.md
  # calls "pure + unit-tested") had never executed anywhere. They were not
  # broken — once run, all 395 tests passed; only 4 type errors needed
  # fixing. A file list silently excludes every new test, so discovery is
  # the gate: adding a *.test.ts file anywhere is enough to have it run.
  edge-fn-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      # These tests import straight from esm.sh and jsr.io at run time. Versions
      # are pinned in the root deno.lock, but payloads are still fetched, so a
      # single registry blip could fail the job on PRs that never touched an edge
      # function — a docs-only
      # PR died on `Import 'https://esm.sh/@supabase/supabase-js@2.50.5' failed: 522`
      # (Cloudflare connection-timeout). Caching DENO_DIR removes the fetch on a
      # cache hit; the retry below covers a cold cache when a registry is flaky.
      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Prepare disposable redirect webhook TLS certificates
        run: node scripts/test-redirect-webhooks.mjs --prepare-only

      # Unit discovery does not import Deno.serve entrypoints. A duplicate
      # block-scoped declaration passed helper tests but boot-failed in prod.
      - name: Check enrichment and Foursquare entrypoints
        working-directory: supabase/functions
        run: deno check --node-modules-dir=none enrich-venue/index.ts source-foursquare/index.ts source-foursquare-free/index.ts

      - name: Run deno unit tests
        working-directory: supabase/functions
        # --node-modules-dir=none is load-bearing. The repo root package.json puts
        # Deno in npm mode, so it expects an up-to-date node_modules/ as soon as the
        # graph reaches an `npm:` specifier (_shared/email.ts, _shared/sentry.ts) —
        # and this job never runs `npm ci`. It passes locally either way because a
        # dev's node_modules/ is already there, so the failure only shows up here.
        # The old 7-file list never reached an npm: specifier, which is why it was
        # not needed before. `none` resolves npm deps from Deno's global cache,
        # matching the Supabase edge runtime (which has no node_modules).
        #
        # Retries only help a network fetch; a genuine assertion failure fails all
        # three attempts, so the gate still holds.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if deno test --allow-net --allow-env --allow-read --node-modules-dir=none; then
              exit 0
            fi
            echo "::warning::deno test attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::deno tests failed after 3 attempts"
          exit 1
