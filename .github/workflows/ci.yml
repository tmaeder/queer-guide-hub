name: CI

# Per-PR correctness gate. Independent jobs run in parallel:
# typecheck, lint, frontend unit tests, scraper tests, worker tests,
# and edge-function deno tests. Each is a hard fail on the PR check.
# Bundle-shape and a11y gates live in their own workflows
# (bundle-shape.yml, a11y.yml) with narrower path filters; this one
# runs on every PR so anything that breaks tsc/eslint/tests is caught
# before review.

on:
  pull_request:
  # Merge queue: a required check that never reports on the merge_group event
  # leaves the queued PR pending forever. Same failure this repo already hit
  # twice with `paths:` filters on required checks.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # Real check of the whole app (tsconfig.app.json) with a baseline ratchet:
      # ~1400 pre-existing errors are recorded in scripts/typecheck-baseline.json
      # and only NEW ones fail. Until 2026-07-29 this step was bare `tsc --noEmit`
      # against the solution-style root tsconfig ("files": [] + references), which
      # without `-b` compiles zero files and always exits 0 — vacuously green.
      - run: npm run typecheck
      # Cloudflare Pages Functions were covered by NO tsconfig until 2026-08-01
      # (tsconfig.app.json is "include": ["src"]), so a type error in the edge
      # middleware that serves crawler meta, branding and sitemaps only ever
      # surfaced in production. Zero-tolerance — it starts at 0 errors.
      - run: npm run typecheck:functions

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint
      # Cloudflare Pages silently ignores config it cannot accept: _redirects
      # rules with an illegal status or a self-looping rewrite target, and a
      # missing _routes.json (which leaves the Functions bundle unrouted, so
      # every Pages Function 404s). Both shipped green on 2026-08-01.
      - run: npm run check:pages-routing

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # Coverage gate is enforced via thresholds in vite.config.ts
      # test.coverage.thresholds (Phase 6, locked 2026-05-16).
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # Scraper unit tests (vitest in scraper/). Cheap to run; bugs here
  # affect daily data ingestion, so we always run on every PR rather
  # than gating on a path filter. Uses `npm install` to match the
  # established extension-ci.yml pattern for sub-package installs.
  scraper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - run: npm install
        working-directory: scraper
      - run: npm test
        working-directory: scraper

  # Worker tests for every workers/* that declares a `test` script.
  # workers/submit is also covered by extension-ci.yml (path-filtered);
  # running it here covers PRs that don't touch the extension paths.
  # Workers without a test script are skipped (auto-picks up new
  # workers as they bootstrap vitest setup).
  worker-tests:
    runs-on: ubuntu-latest
    # Each worker's package.json is installed standalone from its own dir, so it
    # does NOT inherit the repo-root .npmrc (npm reads only $PWD/.npmrc, never a
    # parent's). That root file sets legacy-peer-deps=true to tolerate wrangler's
    # peerOptional @cloudflare/workers-types being a major behind the standalone
    # workers-types the workers depend on. Mirror it here as an env so every
    # per-worker `npm install` applies the same policy (else ERESOLVE).
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - name: Run tests for each worker with a test script
        # `npm install` (not `npm ci`) to match the established
        # extension-ci.yml pattern for sub-package installs.
        run: |
          set -e
          any_run=0
          for pkg in workers/*/package.json; do
            dir=$(dirname "$pkg")
            if node -e "const p=require('./$pkg'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
              echo "::group::$dir"
              (cd "$dir" && npm install && npm test)
              echo "::endgroup::"
              any_run=1
            else
              echo "Skipping $dir (no test script)"
            fi
          done
          if [ "$any_run" -eq 0 ]; then
            echo "::error::No workers/* had a test script — check this job is still doing useful work."
            exit 1
          fi

  # Migration guards. Both steps catch a way to silently kill `supabase db push`:
  #   1. duplicate 14-digit version / malformed filename (pure-local, no DB; see
  #      PR #1553 and scripts/check-migration-versions.mjs — pre-existing
  #      duplicates are grandfathered as warnings)
  #   2. a version already applied to prod with no repo file (queries remote
  #      schema_migrations; see the step comment below)
  migration-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - name: Resolve migration base ref
        run: |
          BASE="${{ github.base_ref }}"
          # merge_group carries no base_ref, and HEAD~1 is not main's tip when
          # the queue batches several PRs into one group.
          if [ -z "$BASE" ] && [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE=main
          fi
          if [ -n "$BASE" ]; then
            git fetch --depth=1 origin "$BASE"
            echo "MIGRATION_BASE_REF=origin/$BASE" >> "$GITHUB_ENV"
          else
            echo "MIGRATION_BASE_REF=HEAD~1" >> "$GITHUB_ENV"
          fi
      # The token lets this step exempt versions ALREADY in remote history. A
      # migration applied via MCP is stamped with the call time, so on this
      # repo (whose migrations are future-dated) the recovered file is born
      # below max — the drift check demands the file and, without this, the
      # ordering rule refuses it. Both gates then block every PR. Without the
      # secret the step stays strict and says it could not verify.
      - name: Run node scripts/check-migration-versions.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xqeacpakadqfxjxjcewc
        run: |
          rc=0
          node scripts/check-migration-versions.mjs || rc=$?
          if [ "$rc" -eq 1 ]; then exit 1; fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Migration version check could not verify against remote history (exit $rc)."
          fi

      # Remote-only versions: a migration applied to prod (MCP apply_migration or
      # raw Management-API SQL) with no committed file makes `supabase db push`
      # skip EVERYTHING — merged migrations silently never apply and nothing goes
      # red. migration-drift-monitor.yml catches it within 6h; this catches it
      # before merge. On pull_request the checkout is the MERGE commit, so the
      # question asked is the right one: would db push skip once this PR lands?
      # (A stale branch therefore does NOT false-positive — main's files are in
      # the merge tree.) Without the secret the script falls back to its
      # credential-free merge-base check; that can't see remote, so it warns.
      - name: Check for remote-only migration versions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xqeacpakadqfxjxjcewc
        run: |
          rc=0
          node scripts/check-migration-drift.mjs || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::Migration drift — a version applied to prod has no repo file. Recover the SQL from schema_migrations.statements into supabase/migrations/<version>_<name>.sql (see CLAUDE.md). Never blindly db pull."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Remote migration drift check could not run (exit $rc) — only the degraded merge-base check ran."
          fi

  # Deno tests for supabase/functions. Mirrors pipeline-health.yml's
  # known-working invocation, but runs the WHOLE tree by discovery — no
  # hardcoded file list. Until 2026-08-02 this named 7 files under _tests/,
  # so 38 of the 45 test files in the tree (every one under _shared/,
  # including the venue-consensus and amenity-normalize suites CLAUDE.md
  # calls "pure + unit-tested") had never executed anywhere. They were not
  # broken — once run, all 395 tests passed; only 4 type errors needed
  # fixing. A file list silently excludes every new test, so discovery is
  # the gate: adding a *.test.ts file anywhere is enough to have it run.
  edge-fn-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # These tests import straight from esm.sh and jsr.io at run time. Versions
      # are pinned in the root deno.lock, but payloads are still fetched, so a
      # single registry blip could fail the job on PRs that never touched an edge
      # function — a docs-only
      # PR died on `Import 'https://esm.sh/@supabase/supabase-js@2.50.5' failed: 522`
      # (Cloudflare connection-timeout). Caching DENO_DIR removes the fetch on a
      # cache hit; the retry below covers a cold cache when a registry is flaky.
      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Run deno unit tests
        working-directory: supabase/functions
        # --node-modules-dir=none is load-bearing. The repo root package.json puts
        # Deno in npm mode, so it expects an up-to-date node_modules/ as soon as the
        # graph reaches an `npm:` specifier (_shared/email.ts, _shared/sentry.ts) —
        # and this job never runs `npm ci`. It passes locally either way because a
        # dev's node_modules/ is already there, so the failure only shows up here.
        # The old 7-file list never reached an npm: specifier, which is why it was
        # not needed before. `none` resolves npm deps from Deno's global cache,
        # matching the Supabase edge runtime (which has no node_modules).
        #
        # Retries only help a network fetch; a genuine assertion failure fails all
        # three attempts, so the gate still holds.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if deno test --allow-net --allow-env --allow-read --node-modules-dir=none; then
              exit 0
            fi
            echo "::warning::deno test attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::deno tests failed after 3 attempts"
          exit 1
