name: Personality editorial batch contract
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: read
jobs:
  contract:
    name: Editorial batch contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/personality-batch-runtime" --no-save --package-lock=false @electric-sql/pglite@0.6.0
      - name: Validate the batch compiler and release contract
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --import tsx --test scripts/data-quality/personality-editorial-batch.contract.mjs
      - name: Exercise publication guards and regression monitoring
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --import tsx --test scripts/data-quality/personality-editorial-guard.contract.mjs scripts/data-quality/personality-editorial-audit.contract.mjs
      - name: Validate committed reviewed manifests
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          for manifest in docs/editorial/personality-batches/*.json; do
            [ -e "$manifest" ] || continue
            node --import tsx scripts/data-quality/personality-editorial-batch.mjs validate "$manifest"
          done
      - name: Exercise changed batch snapshots in PostgreSQL
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          base=HEAD^
          if [ -n "$BASE_SHA" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            base="$BASE_SHA"
          fi
          git diff --name-only "$base" HEAD -- 'docs/editorial/personality-batches/*.json' | while IFS= read -r manifest; do
            [ -f "$manifest" ] || continue
            PERSONALITY_BATCH_MANIFEST="$manifest" node --import tsx --test --test-name-pattern='the actual reviewed batch' scripts/data-quality/personality-editorial-batch.contract.mjs
          done
      - name: Reject broadened legacy exceptions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: node --import tsx scripts/data-quality/check-personality-editorial-baseline.mjs
      - name: Audit the public catalog and all published languages
        run: node --import tsx scripts/data-quality/audit-personality-editorial.ts --baseline docs/editorial/personality-editorial-baseline.json --out personality-editorial-audit.json
      - name: Preserve the public audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: personality-editorial-audit
          path: personality-editorial-audit.json
          if-no-files-found: ignore
          retention-days: 14
