name: Personality editorial batch contract
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: Editorial batch contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/personality-batch-runtime" --no-save --package-lock=false @electric-sql/pglite@0.6.0
      - name: Validate the batch compiler and release contract
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --import tsx --test scripts/data-quality/personality-editorial-batch.contract.mjs
      - name: Validate committed reviewed manifests
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          for manifest in docs/editorial/personality-batches/*.json; do
            [ -e "$manifest" ] || continue
            node --import tsx scripts/data-quality/personality-editorial-batch.mjs validate "$manifest"
          done
      - name: Exercise changed batch snapshots in PostgreSQL
        env:
          PGLITE_MODULE: ${{ runner.temp }}/personality-batch-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          git diff --name-only HEAD^ HEAD -- 'docs/editorial/personality-batches/*.json' | while IFS= read -r manifest; do
            [ -f "$manifest" ] || continue
            PERSONALITY_BATCH_MANIFEST="$manifest" node --import tsx --test --test-name-pattern='the actual reviewed batch' scripts/data-quality/personality-editorial-batch.contract.mjs
          done
