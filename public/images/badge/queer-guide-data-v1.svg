<!-- "Data: queer.guide" badge for other sites to link back with.
     Versioned file name: /*.svg is served immutable for a year (public/_headers),
     so a changed badge must ship under a new name, never overwrite this one.
     Lives under /images/, which public/_routes.json excludes from Pages
     Functions, so an embed on someone else's page costs no Worker invocation.
     Mark geometry is the favicon's rainbow path verbatim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-label="LGBTQ+ data from queer.guide">
  <rect x="0.5" y="0.5" width="199" height="55" rx="12" fill="#FAFAF5" stroke="#111111" stroke-opacity="0.24"/>
  <g transform="translate(10 8) scale(0.4)" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 72 C 20 44 33 26 50 26 C 67 26 80 44 80 72 M 36 72 C 36 54 41 42 50 42 C 59 42 64 54 64 72"/>
  </g>
  <g font-family="'Space Grotesk', Helvetica, Arial, sans-serif" fill="#111111">
    <text x="58" y="24" font-size="11" letter-spacing="0.6">LGBTQ+ DATA</text>
    <text x="58" y="42" font-size="17" font-weight="700">queer.guide</text>
  </g>
</svg>
