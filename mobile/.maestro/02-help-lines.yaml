appId: guide.queer.app
name: Help shows callable support lines without an account
tags: [smoke, safety]
---
# The crisis surface must work signed out and on first launch.
- launchApp:
    clearState: true
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Call .*"
    timeout: 15000
- assertVisible: "In immediate danger, call your local emergency number."
- assertNotVisible: "Couldn't load support lines. If you need help now, call your local emergency number."
