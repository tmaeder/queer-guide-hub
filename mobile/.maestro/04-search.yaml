appId: guide.queer.app
name: Search finds a place by name
tags: [smoke]
---
- launchApp:
    clearState: true
- tapOn: "Search"
# The field, by its placeholder ("Search places and events") without pinning the wording.
- tapOn: "Search .*"
- inputText: "Mylord"
- extendedWaitUntil:
    visible: "Mylord"
    timeout: 15000
