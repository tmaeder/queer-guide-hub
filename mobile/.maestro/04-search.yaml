appId: guide.queer.app
name: Search finds a place by name
tags: [smoke]
---
- launchApp:
    clearState: true
- tapOn: "Search"
# Matches the field by its placeholder ("Search places…") without pinning the exact wording.
- tapOn: "Search .*"
- inputText: "Mylord"
- extendedWaitUntil:
    visible: "Mylord"
    timeout: 15000
