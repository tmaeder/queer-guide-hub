name = "queer-guide-worker-trip-inbox"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Each app inbox has a literal recipient rule managed by the authenticated
# Supabase trip-inbox-manage endpoint. Cloudflare does not support subdomain
# catch-all rules. Reconcile existing inboxes before advertising them.

[vars]
INBOX_DOMAIN = "inbox.queer.guide"
# Threshold above which a parsed item auto-slots into reservations.
AUTO_SLOT_CONFIDENCE = "0.85"
# Cloudflare Workers AI model. (llama-3.1-8b was deprecated 2026-05-30 —
# AiError 5028 — which silently broke all email parsing until 2026-07-11.)
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Workers AI binding — no API key needed, billed via the CF account.
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put NAME`):
#   SUPABASE_URL             - https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY - service-role key (bypasses RLS, server-only)
#   INBOX_ENCRYPTION_KEY     - 32-byte base64 secret used by AES-GCM to
#                              encrypt raw_body_encrypted bytea column.

[observability]
enabled = true
