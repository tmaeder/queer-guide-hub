name = "queer-guide-snapshot-archiver"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]

# Weekly archive sweep at 04:00 UTC Sunday. Tuned so it doesn't overlap with
# the daily scraper full-refresh (03:15 UTC) or the hourly events run.
# Note: CF Workers cron requires named day-of-week (SUN) rather than numeric 0.
[triggers]
crons = ["0 4 * * SUN"]

[vars]
SUPABASE_URL = "https://xqeacpakadqfxjxjcewc.supabase.co"
BATCH_LIMIT = "500"

[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "queer-guide-scraper-snapshots"

# Set these via `wrangler secret put`:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# wrangler secret put ADMIN_SECRET
#   REQUIRED for manual invocation, and the gate FAILS CLOSED: with it unset,
#   `POST /` is refused for everyone (403) rather than allowed for everyone.
#   This line read "optional" until 2026-08-21, and the secret was in fact unset
#   in production that whole time — so the handler's old `if (env.ADMIN_SECRET)`
#   check was skipped entirely and anyone who could reach the worker URL could
#   trigger a batch running with SUPABASE_SERVICE_ROLE_KEY. Nothing looked
#   broken because the weekly cron below runs the `scheduled` handler, which
#   never passes through this gate.
