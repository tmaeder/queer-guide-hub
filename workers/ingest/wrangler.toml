name = "queer-guide-search-ingest"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "EMBED_CACHE"
id = "f54d40f6d0fa4c5680857dbb21971a02"

[[kv_namespaces]]
binding = "INGEST_STATE"
id = "a54963b21b5a497aa0ef76e08fc8923c"

[vars]
AI_GATEWAY_NAME = "qg-search"
EMBED_MODEL = "@cf/baai/bge-m3"
# Rows per scheduled drain. 200 costs ~24 subrequests because the drain fetches,
# embeds and upserts in BATCHES — read DEFAULT_DRAIN_LIMIT in src/index.ts
# before raising this, the subrequest arithmetic is what bounds it.
DRAIN_LIMIT = "200"

# Secrets (set via wrangler secret put NAME):
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   INGEST_TOKEN   (random 32+ bytes; gates /webhook, /backfill and /drain)

# This is the ONLY path that writes an embedding. The comment here used to call
# it a "backstop" for a Supabase DB webhook that was "the fast path"; that
# webhook does not exist and never did on this project — measured 2026-08-23,
# zero triggers reach net.http_request. Sized as a backstop (15 rows / 10 min =
# 2,160/day for all eleven entity types) it starved: 6,209 marketplace listings
# were vector-invisible, and a newest-first work list meant the tail was never
# reached at all.
#
# Now 200 rows every 5 minutes = 57,600/day. The earlier objection to a tighter
# cron still stands and is why this is not "* * * * *": the work-list RPC is
# ~0.5s against a disk-constrained database, so 288 runs/day costs ~2.4 min of
# DB time where 1,440 would cost 12. Throughput comes from the batch, not the
# frequency.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
