name = "queer-guide-search-ingest"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "EMBED_CACHE"
id = "f54d40f6d0fa4c5680857dbb21971a02"

[[kv_namespaces]]
binding = "INGEST_STATE"
id = "a54963b21b5a497aa0ef76e08fc8923c"

[vars]
AI_GATEWAY_NAME = "qg-search"
EMBED_MODEL = "@cf/baai/bge-m3"

# Secrets (set via wrangler secret put NAME):
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   INGEST_TOKEN   (random 32+ bytes; used by Supabase webhook and backfill caller)

# Backstop drain for rows the DB webhook missed. Was "* * * * *": with
# get_stale_embeddings averaging 1.4s (timeouts at 8s) that burned ~33 min/day
# of DB time and 1,440 Workers invocations/day for a webhook-miss trickle.
# The RPC is fixed (uuid join, ~0.5s) and 10-minute staleness is fine for a
# backstop — the webhook remains the fast path.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
